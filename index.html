  <!-- PWA Manifest -->

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />

  <!-- Preconnect & DNS-Prefetch for critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://jvgyjlbjhbfrncwbytls.supabase.co" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <title>IKCOUS Marketplace | Monte Carmelo, MG</title>

  <link rel="stylesheet" href="/loading.css" />
  <!-- Script Silent Guardian: GHOST PURGE V11.5 -->
  <script src="/silent-guardian.js" defer></script>
  <!-- Speculation Rules API: browser-native prefetch (zero JS overhead, Chrome 109+) -->
  <script type="speculationrules">
  {
    "prefetch": [
      {
        "urls": ["/version.json"],
        "eagerness": "eager"
      },
      {
        "urls": ["/?source=pwa"],
        "eagerness": "moderate"
      }
    ]
  }
  </script>

<body>
  <div id="silent-guardian-loader">
    <!-- Aura Mesh Background -->
    <div class="aura-mesh">
      <div class="aura-orb orb-1"></div>
      <div class="aura-orb orb-2"></div>
      <div class="aura-orb orb-3"></div>
    </div>

    <!-- Ambient Stardust (darker for light theme) -->
    <div class="stardust sd-1"></div>
    <div class="stardust sd-2"></div>
    <div class="stardust sd-3"></div>
    <div class="stardust sd-4"></div>

    <!-- Central Core -->
    <div class="glass-core">
      <div class="guardian-logo-container">
        <!-- LOGO_START -->
        <div class="guardian-logo-icon">
          <span>I</span>
        </div>
        <span class="guardian-brand-text">IKCOUS</span>
        <!-- LOGO_END -->
      </div>
    </div>

    <!-- Typography -->
    <div class="cinematic-text">Omniverse Active</div>

    <!-- Progress Bar -->
    <div class="progress-track" id="guardian-progress-track">
      <div class="progress-fill" id="guardian-progress-fill"></div>
    </div>
    <div class="progress-percentage" id="guardian-progress-pct">0%</div>
  </div>

  <div id="root">
    <div class="loading-spinner"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
