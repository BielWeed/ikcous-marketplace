# Hooks de git do IKCOUS Marketplace.
#
# Por que isto importa mais aqui do que num projeto normal: o repositório é
# privado num plano Free do GitHub, e nesse plano branch protection e rulesets
# retornam 403. Não existe trava do lado do servidor. O que existe é este
# arquivo. Ele é contornável com `--no-verify` e só vale para quem rodou
# `npm install` no clone — leia a seção "A trava que não existe" do
# CONTRIBUTING.md antes de confiar nele.
#
# Instalação: automática via script `prepare` do package.json.
# Backlog: INFRA-160.

# Duas chaves de topo, medidas em 20/08/2026, que mantêm esta trava LIGADA
# dentro de um `git worktree` — que é exatamente onde ela estava DESLIGADA
# em silêncio.
#
# O `.git/hooks/pre-commit` é gerado pelo lefthook e é COMPARTILHADO por
# todos os worktrees (o `core.hooksPath` de cada um aponta para o
# `.git/hooks` da árvore principal). O shim gerado procurava o binário em
# `$(git rev-parse --show-toplevel)/node_modules`, que dentro de um worktree
# é a pasta do próprio worktree — e 3 dos 5 não têm `node_modules`. O último
# ramo do shim fazia `echo "Can't find lefthook in PATH"` SEM `exit 1`: o
# git APROVAVA o commit, e a mensagem passava por ruído no meio de uma saída
# de sucesso.
#
# ATENÇÃO à atribuição de causa — quem fecha a trava HOJE é a chave
# `lefthook:` logo abaixo, NÃO esta. O lefthook emite aquela chave como
# `elif test -n "<valor>/../node_modules/.bin/lefthook"`, e essa string tem
# sufixo LITERAL: `test -n` nela é SEMPRE verdadeiro. O ramo é incondicional,
# então TUDO abaixo dele é código morto — inclusive o `else` final onde esta
# chave põe o `exit 1`. Com PATH vazio o shim atual sai com 127 (o binário
# não existe naquele caminho), não com o `exit 1` do `assert_`.
#
# Esta chave fica assim mesmo, como reserva: ela é o que volta a fechar a
# trava se a `lefthook:` for removida ou deixar de resolver. Só não a credite
# pelo comportamento que se observa hoje. Ver `npm run hooks:prova`,
# controles 3 e 4.
assert_lefthook_installed: true

# `--git-common-dir` aponta para o `.git` da ÁRVORE PRINCIPAL a partir de
# qualquer worktree; é ele que acha o `node_modules` que existe de verdade.
#
# `--path-format=relative` NÃO é enfeite. O lefthook emite este valor SEM
# aspas no shim (`then <valor> "$@"`), e sem a flag o git devolve o caminho
# ABSOLUTO — que neste projeto tem espaços ("software Gerenciador ecossistema
# ikcous"). O shell quebrava em palavras e o hook morria com exit 127 em todo
# worktree (`sh: C:/Users/Gabriel/Documents/software: No such file or
# directory`). Com a flag o valor vira `../../../.git`, sem espaço nenhum.
# Medido nos 5 worktrees e na árvore principal: resolve 2.1.10 em ~1 s.
# `npx --no-install lefthook` também resolve, mas custa ~7 s por invocação, e
# são 3 hooks por ciclo de commit/push.
lefthook: "$(git rev-parse --path-format=relative --git-common-dir)/../node_modules/.bin/lefthook"

pre-commit:
  parallel: true
  jobs:
    # Trava mais importante do repositório. O histórico já teve `service_role`
    # do Supabase e senha de banco commitadas enquanto o repo era público.
    - name: secretlint
      glob: "*"
      # O secretlint mascara o valor do segredo por padrão; não passe
      # --no-maskSecrets, senão a credencial vaza no log do terminal.
      run: npx secretlint --secretlintignore .secretlintignore {staged_files}
      fail_text: |
        Segredo detectado nos arquivos staged. NÃO use --no-verify aqui.
        Tire a credencial do arquivo, use variável de ambiente, e só então commite.

    # Bloqueia só ERRO de eslint. Warning não bloqueia: existem 1106 warnings
    # pré-existentes (medido em 30/07/2026) e um hook que reprova por causa
    # deles seria desligado no primeiro dia.
    #
    # Em 05/08/2026 os erros de eslint chegaram a ZERO. Eram 7 quando este hook
    # entrou, e a regra do escoteiro fez o trabalho: os 6 que sobravam foram
    # limpos no PR da ADMIN-010 (#94), que precisava tocar exatamente naqueles
    # arquivos e não conseguia commitar sem resolvê-los.
    #
    # Com o teto do `.lint-baseline.json` em 0, erro novo reprova o CI direto.
    # Se você tocar num arquivo que ganhou erro, vai ter que corrigir para
    # commitar — que é o ponto.
    - name: eslint
      glob: "*.{ts,tsx}"
      # --cache pelo mesmo motivo do lint:ratchet: neste repositorio o eslint
      # custa ~8 s por arquivo no Windows, quase tudo numa regra so
      # (tailwindcss/no-custom-classname, 97,9% do tempo, medido em
      # 10/08/2026). Sem cache, um commit que toca cinco componentes segura o
      # terminal por quase um minuto. O cache guarda o RESULTADO por arquivo,
      # entao o hook continua reprovando erro novo — provado com erro plantado.
      run: npx eslint --max-warnings=-1 --cache --cache-strategy content {staged_files}
      fail_text: |
        Erro de eslint nos arquivos staged (warnings foram ignorados de propósito).
        Corrija o erro — ou, se o erro for pré-existente no arquivo que você tocou,
        fale no Discord antes de usar --no-verify.

    # Não existe job de `biome check` aqui, e a ausência é deliberada.
    # O repositório está em CRLF e o Biome formata em LF por padrão, então
    # `biome check --write` reescreveria o arquivo inteiro a cada commit e
    # geraria conflito com o outro dev. 293 dos 337 diagnósticos do Biome são
    # só isso. Resolver a questão de fim de linha é a INFRA-220; enquanto ela
    # não for feita, o Biome roda no CI em modo informativo e não aqui.

    - name: guarda-de-branch
      run: node scripts/guarda-de-branch.mjs commit

commit-msg:
  jobs:
    # Era `npx commitlint --edit {1}`. Num clone normal funciona, porque o git
    # passa o relativo `.git/COMMIT_EDITMSG`; dentro de um `git worktree` ele
    # passa o caminho ABSOLUTO, e o caminho deste projeto tem espaços — o shell
    # do lefthook quebrava o argumento e o hook reprovava commit válido.
    #
    # A correção original (06/08/2026) resolveu isso jogando o argumento fora
    # e resolvendo sempre COMMIT_EDITMSG sozinha — mas o hook `commit-msg`
    # também roda em `git merge -m "..."`, e aí o git passa MERGE_MSG, não
    # COMMIT_EDITMSG. Ignorar `{1}` fazia o script validar a mensagem do
    # commit ANTERIOR (já aprovada) em vez do merge em curso: um merge com
    # mensagem fora do Conventional Commits passava. Reproduzido e consertado
    # no mesmo dia — o script volta a receber `{1}` e extrai só o basename do
    # último fragmento (nunca tem espaço: é sempre COMMIT_EDITMSG, MERGE_MSG
    # ou SQUASH_MSG), depois pede pro git reconstruir o caminho certo com
    # `--git-path`. Ver o cabeçalho de scripts/commitlint-mensagem.mjs para a
    # medição completa. Não volte a omitir `{1}` sem reproduzir o cenário de
    # merge dentro de um worktree.
    - name: commitlint
      run: node scripts/commitlint-mensagem.mjs {1}
      fail_text: |
        Mensagem de commit fora do padrão Conventional Commits.
        Formato:  tipo(escopo): assunto no imperativo, minúsculo, até 100 caracteres
        Exemplo:  fix(shipping): considera CEP de faixa invertida no cálculo local
        Escopos válidos estão em .commitlintrc.json. Tipos e escopos: CONTRIBUTING.md.

pre-push:
  parallel: false
  jobs:
    # Esta é a única barreira que resta contra push direto em main/develop,
    # já que branch protection não está disponível neste plano do GitHub.
    - name: guarda-de-branch
      run: node scripts/guarda-de-branch.mjs push

    # Checagem real de tipos: ~16s sobre 911 arquivos.
    # NÃO troque por `tsc --noEmit`: o tsconfig.json da raiz tem "files": [],
    # então esse comando analisa 0 arquivo e sempre passa. Era assim até
    # 30/07/2026 (INFRA-020 / INFRA-120).
    #
    # Build NÃO entra aqui de propósito: leva ~1 min e mata a produtividade.
    # Quem pega build quebrado é o CI.
    - name: typecheck
      run: npm run typecheck
      fail_text: |
        Erro de tipo. Rode `npm run typecheck` para ver a lista completa.
