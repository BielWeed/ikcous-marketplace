# Diagnóstico SOMENTE LEITURA das pré-condições de pagamento (29/09/2026).
#
# Contexto: acesso de leitura à Management API do projeto ativo já provado
# (run da "Prova de acesso": GET 200 no projeto e nas 11 functions, todas
# ACTIVE, implantadas em massa em 28/09 ~06:00Z). Este workflow fecha as
# perguntas que faltam ANTES de qualquer publicação, sem efeito colateral:
#
#   (1) GERAÇÃO do banco: últimas migrations aplicadas (a linha nova exige
#       20261175-20261180 do PR #666; a antiga não as tem).
#   (2) RECONCILIADOR: pg_cron tem o job? cron.job_run_details mostra
#       execução recente e com que status.
#   (3) COFRE MP: app_settings tem linha (presença — NUNCA valores; só nomes
#       de colunas e contagem).
#   (4) GERAÇÃO/CORREÇÕES nas functions: baixa o CORPO de
#       criar-pagamento/webhook-mercadopago/estornar-pagamento (GET
#       /functions/{slug}/body — código do repositório, sem segredo) e testa
#       MARCADORES por booleano: linha nova vs antiga, e se alguma das dez
#       correções da PR #711 já está no ar por acaso.
#
# Garantias: SELECTs apenas (mesmo mecanismo do banco.mjs do incidente,
# autorizado pelo dono); nenhum valor de segredo é lido ou impresso; corpos
# de function só geram booleans de marcadores; nada de deploy/DDL/compra.
# Ciclo de vida: arquivo de incidente — apagar com o fim do runbook.
name: Diagnóstico de pagamentos (somente leitura)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: diagnostico-pagamentos
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Migrations + cron + cofre + marcadores das functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module -e '
            const REF = "dekxabvqdsuukijblazl";
            const token = (process.env.SUPABASE_ACCESS_TOKEN ?? "").trim();
            if (token === "") { console.log("::error::Falta o secret SUPABASE_ACCESS_TOKEN"); process.exit(1); }
            const falhas = [];
            const api = async (metodo, caminho, corpo) => {
              const resposta = await fetch(`https://api.supabase.com/v1${caminho}`, {
                method: metodo,
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: corpo === undefined ? undefined : JSON.stringify(corpo),
              });
              const texto = await resposta.text();
              if (!resposta.ok) throw new Error(`${metodo} ${caminho} → ${resposta.status}: ${texto.slice(0, 150)}`);
              return texto === "" ? null : JSON.parse(texto);
            };
            const sql = async (query) => {
              try { return await api("POST", `/projects/${REF}/database/query`, { query }); }
              catch (e) { falhas.push(String(e).slice(0, 120)); return null; }
            };

            // (1) Geração do banco — últimas migrations.
            const migs = await sql("SELECT version FROM supabase_migrations.schema_migrations ORDER BY version DESC LIMIT 12");
            if (migs) {
              console.log("== Migrations (últimas 12, mais nova primeiro) ==");
              for (const m of migs) console.log("-", m.version);
              const temNova = migs.some((m) => String(m.version).startsWith("20261175") || String(m.version).startsWith("20261178") || String(m.version).startsWith("20261180"));
              console.log(`Banco com migrations do PR #666 (2026117x): ${temNova ? "SIM (linha nova)" : "NÃO visto nas 12 últimas (conferir lista acima)"}`);
            } else console.log("== Migrations: consulta falhou (ver falhas no fim) ==");

            // (2) Reconciliador — job e execuções recentes.
            const jobs = await sql("SELECT jobid, jobname, schedule, active FROM cron.job ORDER BY jobname");
            console.log("== pg_cron jobs ==");
            if (jobs && jobs.length) for (const j of jobs) console.log(`- ${j.jobname} | ${j.schedule} | ativo: ${j.active}`);
            else console.log("(nenhum job — RECONCILIADOR NÃO AGENDADO)");
            const runs = await sql("SELECT jobid, status, return_message, start_time FROM cron.job_run_details WHERE start_time > now() - make_interval(days => 3) ORDER BY start_time DESC LIMIT 8");
            console.log("== Runs do cron (últimos 3 dias) ==");
            if (runs && runs.length) for (const r of runs) console.log(`- job ${r.jobid} | ${r.status} | ${String(r.start_time).slice(0, 19)} | ${String(r.return_message ?? "").slice(0, 60)}`);
            else console.log("(nenhuma execução nos últimos 3 dias — reconciliador SEM prova de vida)");

            // (3) Cofre MP — presença (nomes de colunas + contagem; NUNCA valores).
            const cols = await sql("SELECT column_name FROM information_schema.columns WHERE table_schema=$$public$$ AND table_name=$$app_settings$$ ORDER BY ordinal_position");
            if (cols) console.log("== app_settings colunas ==", cols.map((c) => c.column_name).join(", "));
            const conta = await sql("SELECT count(*)::int AS n FROM app_settings");
            if (conta) console.log(`app_settings linhas: ${conta[0].n} ${conta[0].n > 0 ? "(cofre PRESENTE — valores nunca lidos)" : "(VAZIA — cofre MP ausente)"}`);

            // (4) Marcadores nos corpos das functions (booleans, sem despejar código).
            const MARCADORES = [
              ["linha-nova Orders API/idempotência por tentativa", "chaveDeIdempotencia"],
              ["frente 3: política PIX chave própria", "pixSemChaveDeAssinatura"],
              ["frente 7: recuperação do 409 PIX", "recuperarOrderPixDoIdempotencia"],
            ];
            const WEBHOOK = [
              ["linha-nova W9: formato confiável do estorno", "formatoConfiavelParaEstorno"],
              ["frente 8: fim da reserva global do segredo", "reserva do ambiente não vale"],
              ["frente 9: recusa ilegível sob sentinela", "vaga em SENTINELA"],
            ];
            const ESTORNO = [["frente 5: gate estorno_de_sistema", "estorno_de_sistema"]];
            for (const [slug, marcas] of [["criar-pagamento", MARCADORES], ["webhook-mercadopago", WEBHOOK], ["estornar-pagamento", ESTORNO]]) {
              try {
                // /body devolve código CRU (não JSON) — fetch direto.
                const resposta = await fetch(`https://api.supabase.com/v1/projects/${REF}/functions/${slug}/body`, {
                  headers: { Authorization: `Bearer ${token}` },
                });
                const texto = await resposta.text();
                if (!resposta.ok) throw new Error(`body ${slug} → ${resposta.status}`);
                console.log(`== ${slug} (${texto.length} bytes) ==`);
                for (const [nome, marcador] of marcas) console.log(`- ${nome}: ${texto.includes(marcador) ? "PRESENTE" : "ausente"}`);
              } catch (e) {
                console.log(`== ${slug}: download falhou (${String(e).slice(0, 100)}) ==`);
              }
            }

            if (falhas.length) {
              console.log("== Falhas de consulta ==");
              for (const f of falhas) console.log("-", f);
            }
          '
