# CI do IKCOUS Marketplace — o primeiro workflow deste repositório (INFRA-040).
#
# Regra que guiou o desenho: um CI que nasce vermelho é um CI que todo mundo
# aprende a ignorar. Então cada job aqui foi EXECUTADO na máquina antes de
# entrar, e o que está vermelho hoje está marcado como informativo, com o
# número medido e a task que resolve. Nada aqui é aspiracional.
#
# Estado medido em 30/07/2026, na raiz do repositório:
#   npm run typecheck    -> exit 0  (911 arquivos, 16s)      BLOQUEIA
#   npm run build        -> exit 0  (NODE_ENV=production)    BLOQUEIA
#   npm run size         -> exit 0  (515 kB de 800 kB)       BLOQUEIA
#   npm test             -> exit 0  (12 testes Deno)         BLOQUEIA
# Medido em 05/08/2026, depois da INFRA-150 (#155) e da PUSH-010 (#156):
#   npm test             -> exit 0  (32 Deno + 11 Deno + 23 vitest = 66, 5,8 s)
#   npm run secretlint   -> exit 0  (0 achados)              BLOQUEIA
#   npm run lint:ratchet -> exit 0  (dívida no teto, não subiu)  BLOQUEIA SE SUBIR
#   npm run lint:links   -> exit 0  (164 links, 0 quebrados) BLOQUEIA
#
# `npm run lint` cru sai com 1 e sempre sairá enquanto houver dívida antiga.
# Quem entra no CI é a catraca, que compara com `.lint-baseline.json`.
# Os números foram medidos AQUI no CI, não na máquina do Gabriel: no Windows
# dele o eslint conta 14 erros (varre uma cópia do repo em .claude/worktrees)
# e o biome conta 100 (CRLF contra LF). Números locais não servem de teto.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Não existe branch protection neste repositório (privado + plano Free = 403),
# então estes checks não conseguem BLOQUEAR um merge no GitHub. Eles informam.
# A decisão de não mergear com o CI vermelho é acordo entre os dois devs.
# Ver a seção "A trava que não existe" do CONTRIBUTING.md.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma versão que a Vercel usa para gerar o artefato de produção
  # (`vercel project inspect ickous-marketplace` -> Node.js Version 24.x).
  # Se divergir, o CI passa e o deploy quebra.
  NODE_VERSION: "24"

jobs:
  typecheck:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `npm run typecheck` é `tsc -b --force`, e isso importa: até 30/07/2026
      # era `tsc --noEmit`, que com `"files": []` no tsconfig.json da raiz
      # analisava 0 arquivo e passava sempre. Se alguém "simplificar" de volta,
      # este job vira verde falso. (INFRA-020 / INFRA-120)
      - run: npm run typecheck

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # O `npm ci` entrou aqui com o vitest (INFRA-150): ate 05/08/2026 este job
      # so precisava do Deno, porque os dois conjuntos de teste rodavam sem
      # node_modules. Nao vale a pena partir em dois jobs: um `npm test` unico
      # e a mesma linha que o dev roda na maquina dele, e job separado abre
      # espaco para o CI e a maquina divergirem sem ninguem notar.
      - run: npm ci
      # `npm test` roda tres conjuntos, 798 casos somados (medidos em
      # 20/08/2026: 294 + 60 + 444). Se voce mexer na suite, MEDA de novo em
      # vez de somar a diferenca no numero antigo — os sub-totais abaixo ja
      # ficaram anos-luz atras por terem sido mantidos assim.
      #
      # test:edge — 294 casos em Deno, varrendo supabase/functions/ inteiro.
      # Historico de como a pasta encheu: calculate-shipping existia desde
      # antes e nunca tinha sido executada por ninguem (INFRA-140); send-push
      # (PUSH-010) sobe um push service local para provar o envio sem tocar a
      # rede; notify-new-order e' a PEDIDO-020 (#166). O script aponta para a
      # PASTA de proposito: citar arquivo faz teste novo de edge function
      # nascer fora do CI, que foi o que aconteceu com a send-push — e a
      # prova de que funciona e que os 11 da notify-new-order entraram aqui
      # sozinhos, sem ninguem editar este workflow.
      #
      # test:unit — 60 testes / 73 steps em tests/, em Deno, sobre os axiomas
      # do Truth Gate (PR #145), sobre o cabeçalho condicional do rollback do
      # db-apply (PR do buraco "restaurada vs criada") e sobre o veredito da
      # verificacao pos-aplicacao do db-apply (resumirVerificacao,
      # classificarChecagem, avaliarChecagem — o defeito de 20/08/2026 em que
      # duas migrations sem verificacao saiam como "Tudo aplicado e
      # verificado"). Moram fora de src/ de proposito: um _test.ts la dentro
      # entraria no `tsc -b` e quebraria o job de tipos com os globais do Deno.
      #
      # test:front — 444 casos de vitest em 78 arquivos de tests/front/, que o
      # script do Deno ignora explicitamente. Comecou em src/lib/mappers.ts
      # (INFRA-150) e hoje cobre tela.
      #
      # Os tres somados nao tocam rede externa. No Linux do CI rodam em poucos
      # segundos. Na maquina Windows do Gabriel o test:front leva ~40 s e o
      # resultado NAO e' deterministico: medido em 20/08/2026, duas rodadas
      # consecutivas na mesma arvore, sem nada mudar entre elas, deram 3 e
      # depois 6 falhas — todas `Test timed out in 5000ms`, e um dos casos
      # acusados passa em 4,15 s quando roda isolado; uma terceira rodada, ja
      # sobre a develop, saiu 444/444 verde. Instabilidade de ambiente, nao
      # defeito: vermelho de test:front nesta maquina nao distingue codigo
      # quebrado de PC ocupado, e verde tambem nao prova muito. Quem cobra e'
      # o CI, no Linux.
      - run: npm test

  build:
    name: Build e tamanho
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # NODE_ENV explícito por causa da vite.config.ts:143, que lê
      # `process.env.NODE_ENV` em vez do `mode` do Vite. Sem isto, o build
      # sai em modo desenvolvimento e o `size` mede o artefato errado.
      # (regra 4 do contexto de onboarding / INFRA-120)
      - name: Build de produção
        run: npm run build
        env:
          NODE_ENV: production
      # O build NÃO precisa de VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY:
      # a falta delas quebra em runtime (tela branca), não em build time.
      # Verificado rodando o build sem elas. Por isso este job não usa secrets.
      - name: Limite de tamanho
        run: npm run size

  secrets:
    name: Varredura de segredo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Varre só o diff. O repositório já teve `service_role` do Supabase e
      # senha de banco no histórico enquanto era público; o objetivo aqui é
      # impedir que entre credencial NOVA, não reauditar o passado.
      - name: Varre os arquivos alterados
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Sem base para comparar (branch nova). Varrendo o repositório inteiro."
            npm run secretlint
            exit 0
          fi
          # NÃO volte para `mapfile -t ARQUIVOS < <(git diff ...)`.
          #
          # `set -euo pipefail` não alcança o process substitution: se o
          # `git diff` falha lá dentro, o mapfile ainda sai 0 e a lista vem
          # VAZIA. Medido em 20/08/2026 — o passo caía em "Nenhum arquivo
          # alterado", saía 0, e o job ficava verde sem o secretlint ter
          # olhado um único arquivo. Num repositório que já teve
          # `service_role` e senha de banco no histórico, e sem branch
          # protection para segurar o merge.
          #
          # Aqui o diff é um comando simples, com o status tratado na hora, e
          # a falha cai no fallback que varre tudo em vez de aprovar sem
          # varrer. Fechado por tests/ci_varredura_de_segredo_test.ts, que
          # extrai este bloco e mede se o secretlint É CHAMADO em cada caso.
          LISTA="${RUNNER_TEMP:-/tmp}/arquivos-do-diff.txt"
          ERRO="${RUNNER_TEMP:-/tmp}/erro-do-diff.txt"
          if ! git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$LISTA" 2> "$ERRO"; then
            echo "O git diff falhou — não há lista de arquivos confiável:"
            cat "$ERRO"
            echo "Varrendo o repositório inteiro em vez de aprovar sem varrer."
            npm run secretlint
            exit 0
          fi
          mapfile -t ARQUIVOS < "$LISTA"
          if [ "${#ARQUIVOS[@]}" -eq 0 ]; then
            echo "Nenhum arquivo alterado (o git diff rodou e voltou vazio)."
            exit 0
          fi
          printf 'Varrendo %d arquivo(s).\n' "${#ARQUIVOS[@]}"
          # O secretlint mascara o valor do segredo por padrão. Não acrescente
          # --no-maskSecrets: isso imprimiria a credencial no log público do job.
          npx secretlint --secretlintignore .secretlintignore "${ARQUIVOS[@]}"

  lint:
    name: Catraca de lint
    runs-on: ubuntu-latest
    # Este job BLOQUEIA, mas só se a dívida SUBIR.
    #
    # O repositório entrou nesta dupla com dívida pré-existente, medida aqui
    # no CI em 30/07/2026: eslint com 7 erros e 553 warnings, biome com 31
    # erros. Duas saídas fáceis foram descartadas:
    #
    #   `npm run lint` puro          -> vermelho em todo PR desde o dia 1, por
    #                                   dívida que nenhum dos dois criou. O
    #                                   resultado conhecido é a dupla aprender
    #                                   a ignorar o CI inteiro.
    #   `continue-on-error: true`    -> X vermelho permanente no PR, que treina
    #                                   exatamente o mesmo reflexo. E um job
    #                                   que nunca pode falhar não vale nada.
    #
    # A catraca compara com os tetos de `.lint-baseline.json` e reprova só o
    # que aumentar. Nasce verde e bloqueia dívida nova. Quando um número cair,
    # ela avisa para abaixar o teto no mesmo PR.
    #
    # Alvo é zerar: INFRA-250 para os warnings de eslint, INFRA-220
    # para o alcance do Biome e a normalização de fim de linha.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Compara com o teto de dívida
        run: npm run lint:ratchet

  docs:
    name: Links da documentação
    runs-on: ubuntu-latest
    # Este job BLOQUEIA, e nasce verde: 164 links relativos em 33 arquivos, 0
    # quebrados, medido em 05/08/2026 (DOC-050).
    #
    # Por que virou job e não continuou sendo conferência manual: a DOC-050
    # (#64) nasceu porque três arquivos eram linkados sem existir, e em CINCO
    # DIAS o defeito inverteu — os arquivos passaram a existir e o texto
    # continuou anunciando que não existiam. Nos dois sentidos quem chega segue
    # o link, bate em nada e para de confiar no material. A documentação deste
    # repositório envelhece rápido demais para depender de alguém lembrar.
    #
    # É o único job do arquivo SEM `npm ci`: o verificador só usa builtins do
    # Node, então instalar dependência aqui seria ~40s para não mudar nada.
    # Por isso ele roda em segundos e pode ser o primeiro a dar retorno no PR.
    #
    # O que ele não cobre está escrito em scripts/verifica-links-md.mjs:
    # URL externa (rede alheia deixaria o job vermelho sem culpa do PR) e
    # âncora `#secao` (falso positivo garantido com heading acentuado).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verifica os links relativos dos .md
        run: npm run lint:links

  objetos:
    name: Código x banco (objetos usados)
    runs-on: ubuntu-latest
    # Detector da BANCO-080 (#139): todo nome passado para .from()/.rpc()/
    # .storage.from() em src/ e supabase/functions/ conferido contra o
    # catálogo REAL do banco (pg_class, pg_proc, storage.buckets).
    #
    # Nasceu do caso de 05/08/2026: vw_produtos_admin não existia em nenhum
    # schema enquanto o front a chamava em sete lugares — cadastrar produto
    # quebrado em produção, escondido pelo fallback de StoreContext. O ledger
    # de migrations não pegaria: nunca houve migration criando a view.
    #
    # Distingue AUSENTE (o banco não tem) de INALCANÇÁVEL (tem, mas nenhum
    # papel da origem alcança) — defeitos de correção diferente.
    #
    # PRECONDIÇÃO: o secret DATABASE_URL do repo (leitura de catálogo; mesmo
    # valor do .env da máquina). Enquanto não existir, o script sai 0 com um
    # ::warning:: visível no log — detector inerte é dívida declarada, não
    # vermelho que o time aprende a ignorar (regra deste arquivo). A lógica
    # em si já é coberta sem banco por tests/db_check_objetos_do_codigo_test.ts
    # (caso da view sumida semeado), que roda no job Testes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Só pelo `pg`: o detector em si usa node:fs/node:path.
      - run: npm ci
      - name: Confere objetos usados pelo código contra o catálogo do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db-check-objetos-do-codigo.mjs
