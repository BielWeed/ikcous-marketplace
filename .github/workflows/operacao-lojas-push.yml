# Temporário (28/09/2026): par VAPID das lojas novas (notificações).
name: Operação — notificações das lojas novas (temporário)
on:
  push:
    branches: [infra/operacao-incidente]
    paths:
      - scripts/incidente/lojas-push.mjs
      - .github/workflows/operacao-lojas-push.yml
permissions:
  contents: read
concurrency:
  group: lojas-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/incidente/lojas-push.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN_CONTA2: ${{ secrets.SUPABASE_ACCESS_TOKEN_CONTA2 }}
      - name: Confere a chave na ficha das lojas
        run: |
          sleep 70
          for h in almeidastore brandmeliz spacelojadoskit; do
            c=$(curl -s "https://$h.vercel.app/" | grep -o '"vapidPublicKey":"[A-Za-z0-9_-]\{20\}' | head -1)
            echo "$h: ${c:-SEM chave VAPID na ficha}"
          done
