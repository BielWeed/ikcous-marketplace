# Login de UMA loja assinante (26/11/2026): `conferir` diz SIM/NAO/INCERTO para
# "a loja pode abrir o cadastro para clientes" (só leitura); `acertar` troca o
# site_url de localhost pelo domínio da loja (store_config.dominio_publico), põe
# https://<dominio>/** na lista de endereços autorizados e sobe o limite de
# e-mails para 30/h quando há remetente próprio. O PATCH só leva site_url,
# uri_allow_list e rate_limit_email_sent; termina rodando conferir.
#
# A lógica mora em scripts/publicacao/login-da-loja.cjs (regras em
# login-da-loja-regras.cjs, com as fontes oficiais no cabeçalho).
# Conferir sai verde SÓ com SIM. Acertar sai verde quando gravou e confirmou
# (ou não tinha nada a gravar), mesmo com veredito NAO na loja recém-nascida,
# que ainda não tem o Gmail.
#
# PROJETO: menu fechado GERADO de scripts/frota/lojas.json (só assinantes) e
# validado de novo contra ele antes do passo com segredo. O ref é resolvido
# dentro do script; nunca texto livre.
# CREDENCIAL: nenhuma nova; cada loja vê SÓ o seu segredo de gestão, só no
# último passo; 401/403 PARAM sem tentar outro.
# DESFAZER: o log de `acertar` imprime os valores de ANTES (não secretos); o
# runbook docs/runbooks/producao-unica-fonte.md diz como voltar a eles.
#
# USO (gh):
#   gh workflow run login-da-loja.yml --ref <ramo> -f projeto=savy \
#     -f acao=conferir -f expected_sha=<SHA completo do topo do ramo>
#
# Testado por tests/ci_login_da_loja_test.ts e tests/frota_lojas_test.ts.
name: Login da loja
run-name: "login da loja em ${{ inputs.projeto }}: ${{ inputs.acao }}"

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "Loja: o nome EXATO de uma loja assinante de scripts/frota/lojas.json (nunca um ref livre); loja desconhecida é recusada antes de qualquer segredo"
        required: true
        type: choice
        default: ikcous-publicada
        options:
          # LOJAS-OPCOES-ASSINANTES-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          - ikcous-publicada
          - savy
          # LOJAS-OPCOES-ASSINANTES-FIM
      acao:
        description: "conferir (só leitura; verde só com SIM) ou acertar (site_url, lista de endereços e limite de e-mails; depois confere)"
        required: true
        type: choice
        default: conferir
        options:
          - conferir
          - acertar
      expected_sha:
        description: "SHA completo aprovado (40 hex), igual ao GITHUB_SHA deste run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: login-da-loja-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    # Gaveta da loja: o token de loja OAuth mora no environment loja-<projeto>
    # (mesmo nome de segredo); sem gaveta propria vale o segredo do repositorio.
    # deployment: false = so os segredos, sem registro de deploy.
    environment:
      name: loja-${{ inputs.projeto }}
      deployment: false
    timeout-minutes: 5
    steps:
      - name: Confere o alvo, a ação e o SHA antes de checkout e segredos
        env:
          PROJETO: ${{ inputs.projeto }}
          ACAO: ${{ inputs.acao }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PROJETO" =~ ^[a-z][a-z0-9-]{1,39}$ ]]; then
            echo "::error::loja desconhecida (nome fora do formato)"; exit 1
          fi
          case "$ACAO" in
            conferir|acertar) ;;
            *) echo "::error::ação desconhecida"; exit 1 ;;
          esac
          if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
            echo "::error::expected_sha completo e igual ao GITHUB_SHA é obrigatório"; exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # A loja existe no cadastro (scripts/frota/lojas.json) e e ASSINANTE? Recusa
      # ("loja desconhecida") ANTES do passo que ve segredo. Nao le segredo.
      - name: Confere a loja no cadastro (lojas.json) antes de qualquer segredo
        env:
          PROJETO: ${{ inputs.projeto }}
        run: node scripts/frota/lojas.cjs validar "$PROJETO" --assinante

      # O token só chega ao script, e só o da loja escolhida. Nunca fallback.
      - name: Confere ou acerta os endereços e o limite do login
        env:
          # LOJAS-SEGREDOS-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDOS-FIM
          PROJETO: ${{ inputs.projeto }}
          ACAO: ${{ inputs.acao }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/publicacao/login-da-loja.cjs
