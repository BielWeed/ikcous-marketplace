# Temporário (incidente 28/09/2026): termina a troca do banco da loja para o
# projeto novo do Supabase (dekxabvqdsuukijblazl) — grava a chave nova na frota,
# acerta as variáveis da Vercel, refaz o deploy de produção e testa os domínios.
# Autorizado pelo dono (Gabriel) no chat do incidente. Apagar a branch depois.
name: Operação do incidente (temporário)
on:
  push:
    branches: [infra/operacao-incidente]
    paths: [scripts/incidente/banco.mjs, scripts/incidente/vercel.mjs]
permissions:
  contents: read
concurrency:
  group: operacao-incidente
  cancel-in-progress: false
jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/incidente/banco.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  vercel:
    needs: banco
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/incidente/vercel.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # O que estava no ar antes do incidente: deploy de 25/09 19:31 UTC = merge do
          # #663 na branch da Super atualização (package.json 1.5.9).
          DEPLOY_REF: claude/app-major-upgrade-wmc8x2
          DEPLOY_SHA: 846023e0da42639ecb7ff1966d9557e6874f6dfa
