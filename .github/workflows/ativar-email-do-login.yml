# Uma loja por execução. Nenhum dispatch deve ocorrer antes da revisão de
# risco e do deploy da auth-send-email ACTIVE com verify_jwt=false.
# Ativar exige essa publicação sem verificação de login (Auth assina o webhook).
# Preparar cria desligado; se já preparado, preserva ligado/desligado e o segredo.
# Desfazer: mesma loja/SHA aprovado, acao=desativar (só PATCH enabled=false).
name: E-mail do login por loja
run-name: "email do login em ${{ inputs.projeto }}: ${{ inputs.acao }}"

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "Loja: o nome EXATO de uma loja assinante de scripts/frota/lojas.json (nunca um ref livre); loja desconhecida é recusada antes de qualquer segredo"
        required: true
        type: choice
        default: ikcous-publicada
        options:
          # LOJAS-OPCOES-ASSINANTES-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          - ikcous-publicada
          - savy
          # LOJAS-OPCOES-ASSINANTES-FIM
      acao:
        description: "Medir; preparar sem desligar hook pronto; ativar com guardas; desativar para desfazer"
        required: true
        type: choice
        default: medir
        options:
          - medir
          - preparar
          - ativar
          - desativar
      expected_sha:
        description: "SHA completo aprovado (40 hex), igual ao GITHUB_SHA deste run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: email-do-login-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confere o alvo e o SHA antes de checkout e segredos
        env:
          PROJETO: ${{ inputs.projeto }}
          ACAO: ${{ inputs.acao }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PROJETO" =~ ^[a-z][a-z0-9-]{1,39}$ ]]; then
            echo "::error::loja desconhecida (nome fora do formato)"; exit 1
          fi
          case "$ACAO" in
            medir|preparar|ativar|desativar) ;;
            *) echo "::error::ação desconhecida"; exit 1 ;;
          esac
          if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
            echo "::error::expected_sha completo e igual ao GITHUB_SHA é obrigatório"; exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # A loja existe no cadastro (scripts/frota/lojas.json) e e ASSINANTE? Recusa
      # ("loja desconhecida") ANTES do passo que ve segredo. Nao le segredo.
      - name: Confere a loja no cadastro (lojas.json) antes de qualquer segredo
        id: loja
        env:
          PROJETO: ${{ inputs.projeto }}
        run: node scripts/frota/lojas.cjs validar "$PROJETO" --assinante --saida-do-passo

      # O token só chega ao script, e só o da loja escolhida. Nunca fallback.
      - name: Mede ou configura só os campos do Send Email Hook
        env:
          # LOJAS-SEGREDOS-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDOS-FIM
          PROJETO: ${{ inputs.projeto }}
          ACAO: ${{ inputs.acao }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/publicacao/ativar-email-do-login.cjs
