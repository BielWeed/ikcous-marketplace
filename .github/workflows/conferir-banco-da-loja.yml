# Roda, sob demanda, as conferências de pré/pós-publicação que uma pessoa
# fazia à mão no SQL Editor (docs/runbooks/publicar-painel-cartao-devolucoes.md
# §0/§1), o horário do último backup, e o registro do ledger
# (`supabase_migrations.schema_migrations`) para as faixas 72-74 e 75-78.
#
# POR QUE EXISTE: as consultas do runbook eram "cole no SQL Editor" — um
# passo manual, sem registro, que só quem tinha acesso ao painel do Supabase
# conseguia rodar. Aqui o coordenador escolhe a consulta pelo nome e o
# workflow imprime o resultado no log e no resumo do run.
#
# SÓ LEITURA, POR CONSTRUÇÃO: a lógica mora em
# scripts/publicacao/conferir-banco.cjs (NÃO em `node -e "…"` — foi a crase
# dentro de `node -e` que virou substituição de comando do bash em
# aplicar-migrations.yml). Toda consulta de conferência entra num
# `BEGIN READ ONLY;` sem COMMIT, além de pedir `read_only: true` no request —
# os dois mecanismos documentados pela Management API (ver o cabeçalho do
# script). O único job que ESCREVE é o `ledger`, e só quando `confirmar`
# for exatamente `GRAVAR`.
#
# CREDENCIAL: o mesmo segredo `SUPABASE_ACCESS_TOKEN` que
# aplicar-migrations.yml e publicar-functions.yml já usam. Nenhuma
# credencial nova.
#
# USO: Actions → Run workflow →
#   consulta      = um arquivo de scripts/publicacao/consultas/ (sem `.sql`),
#                   ou "backups";
#   projeto_ref   = default: o projeto da loja;
#   gravar_ledger = "nao" (default), "72-74" ou "75-78";
#   confirmar     = só o job do ledger olha isto — precisa ser exatamente
#                   "GRAVAR" para gravar de verdade.
#
# Testado por tests/ci_conferir_banco_test.ts.

name: Conferir banco da loja

on:
  workflow_dispatch:
    inputs:
      consulta:
        description: "Consulta a rodar (scripts/publicacao/consultas/, sem .sql) ou backups"
        required: true
        type: choice
        default: backups
        options:
          - 0a-antes-base-e-nada-aplicado
          - 0b-conferir-corpos-vivos
          - 0c1-corpos-vivos-72-74
          - 0c2-funcoes-72-74-ainda-nao-existem
          - 1a-conferir-o-que-nasceu
          - 1b-conferir-marcadores
          - 2a-marcadores-72-74
          - 2b-objetos-72-74
          - 3a-cpf-no-endereco
          - backups
      projeto_ref:
        description: "Ref do projeto Supabase (default: o projeto da loja)"
        required: false
        default: "cafkrminfnokvgjqtkle"
      gravar_ledger:
        description: "Gravar o ledger de qual faixa? (nao = só conferir, sem gravar)"
        required: false
        type: choice
        default: nao
        options:
          - nao
          - 72-74
          - 75-78
      confirmar:
        description: "Só o job do ledger olha isto: precisa ser exatamente GRAVAR"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir ${{ inputs.consulta }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Confere o segredo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN ausente no repositório (Settings → Secrets and variables → Actions)"; exit 1
          fi

      - name: Roda a consulta (só leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJETO_REF: ${{ inputs.projeto_ref }}
          CONSULTA: ${{ inputs.consulta }}
        run: node scripts/publicacao/conferir-banco.cjs

  ledger:
    name: Gravar ledger ${{ inputs.gravar_ledger }}
    needs: conferir
    if: inputs.gravar_ledger != 'nao' && inputs.confirmar == 'GRAVAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Grava o ledger fixo da faixa e confere 72-78 (só leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJETO_REF: ${{ inputs.projeto_ref }}
          LEDGER: ${{ inputs.gravar_ledger }}
        run: node scripts/publicacao/conferir-banco.cjs
