          - backups
      projeto:
        description: "Projeto de destino: loja, sandbox, ikcous-publicada (a CAF explicita) ou savy (a loja cliente explicita, mesmas travas): as duas exigem expected_sha; nunca texto livre — achado da rodada 2"
        required: false
        type: choice
        default: loja
        options:
          - loja
          - sandbox
          - ikcous-publicada
          - savy
      expected_sha:
        description: "So para projeto = ikcous-publicada ou savy: o SHA completo (40 hex) do commit deste run (igual ao GITHUB_SHA); vazio nas outras lojas"
        required: false
        default: ""
      gravar_ledger:
        description: "Gravar o ledger de qual faixa? (nao = só conferir, sem gravar)"
        required: false
        type: choice
        default: nao
        options:
          - nao
          - 72-74
          - 75-78
          - 79-82
          - "83"
          - 92-202
          - 60-66
      confirmar:
        description: "Só o job do ledger olha isto: precisa ser exatamente GRAVAR"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  conferir:
    if: ${{ !inputs.ikcous_original && !inputs.ikcous_publicado }}
    name: Conferir ${{ inputs.consulta }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PRIMEIRO passo, antes de checkout e de qualquer requisição: a CAF e a
      # Savy explícitas só rodam com expected_sha completo e igual ao GITHUB_SHA
      # (mesmo padrão e mesma mensagem do publicar-functions.yml).
      - name: Confere o alvo (expected_sha na CAF e na Savy explícitas)
        env:
          PROJETO: ${{ inputs.projeto }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$PROJETO" = "ikcous-publicada" ] || [ "$PROJETO" = "savy" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
              echo "::error::Loja cliente ($PROJETO) exige expected_sha completo e igual ao GITHUB_SHA do run"; exit 1
            fi
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Cada alvo enxerga SÓ o seu segredo: a expressão `&& … || ''` nunca cai
      # no outro (segredo vazio dá '', não o segredo do vizinho).
      - name: Confere o segredo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'savy' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          PROJETO: ${{ inputs.projeto }}
        run: |
          if [ "$PROJETO" = "ikcous-publicada" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN_IKCOUS" ]; then
              echo "::error::sem acesso legítimo à CAF por SUPABASE_ACCESS_TOKEN_IKCOUS — bloqueio concreto"; exit 1
            fi
          elif [ "$PROJETO" = "savy" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN_SAVY" ]; then
              echo "::error::sem acesso legítimo à Savy por SUPABASE_ACCESS_TOKEN_SAVY — bloqueio concreto"; exit 1
            fi
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN ausente no repositório (Settings → Secrets and variables → Actions)"; exit 1
          fi

      - name: Roda a consulta (só leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'savy' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          PROJETO: ${{ inputs.projeto }}
          CONSULTA: ${{ inputs.consulta }}
        run: node scripts/publicacao/conferir-banco.cjs

  ledger:
    name: Gravar ledger ${{ inputs.gravar_ledger }}
    # `ikcous-publicada` e `savy` NÃO gravam as faixas 72..83 (as lojas explícitas
    # são só leitura nelas). ÚNICA EXCEÇÃO (06/10/2026): a faixa `92-202`, o
    # BACKFILL do registro das 9 migrations 20261192..20261202 (sem a 201) que a CAF
    # já tem aplicadas, e que o aplicar-migrations.yml passa a registrar no próprio
    # apply daqui para a frente. Só grava depois da pré-checagem OBRIGATÓRIA da
    # 8e-conferir-92-a-202-aplicado (todas as linhas ok=true, feita ANTES do
    # INSERT em conferir-banco.cjs), com INSERT fixo, idempotente (ON CONFLICT DO
    # NOTHING) e pinado por SHA-256, e `confirmar` = GRAVAR. E a faixa 92-202 é SÓ
    # das lojas explícitas: `loja`/`sandbox` (segredo legado, sem expected_sha)
    # não a gravam (revisão final de 06/10; a recusa também está no script).
    # A faixa `60-66` (06/10/2026) é o BACKFILL do REGISTRO das 7 migrations
    # 20261160..20261166, cujo efeito já está vivo na CAF e que NUNCA se reaplicam: é
    # SÓ de `ikcous-publicada` (a Savy não tem esse buraco; loja/sandbox/lojas de teste
    # nunca). Só grava depois da leitura prévia do ledger (a lacuna da CAF) e da
    # pré-checagem OBRIGATÓRIA da 9a-conferir-60-a-66-aplicado (rol fechado, todas as
    # linhas ok=true), com INSERT guardado e pinado por SHA-256, e relê o ledger para
    # CONFERIR as 7 linhas. A expressão do `if` espelha o mapa do script:
    # ikcous-publicada: 92-202 e 60-66; savy: 92-202; qualquer outro: nenhuma das duas.
    if: ${{ !inputs.ikcous_original && !inputs.ikcous_publicado && ((inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'savy' && inputs.gravar_ledger != '92-202' && inputs.gravar_ledger != '60-66') || (inputs.projeto == 'ikcous-publicada' && (inputs.gravar_ledger == '92-202' || inputs.gravar_ledger == '60-66')) || (inputs.projeto == 'savy' && inputs.gravar_ledger == '92-202')) && inputs.gravar_ledger != 'nao' && inputs.confirmar == 'GRAVAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmo grupo de aplicar-migrations.yml: nunca gravar o ledger enquanto
    # uma migration está sendo aplicada (nem o contrário).
    concurrency:
      group: banco-da-loja
      cancel-in-progress: false
      # queue: max (não o default "single"): sem isto, um segundo LEDGER
      # disparado enquanto o primeiro roda CANCELA o primeiro em vez de
      # esperar a vez — achado da rodada 3 da revisão de risco.
      queue: max
    steps:
      # Nas lojas explícitas (única faixa permitida: 92-202) vale a mesma trava de
      # sempre: expected_sha completo e igual ao GITHUB_SHA, no PRIMEIRO passo,
      # antes do checkout e de qualquer requisição.
      - name: Confere o alvo (expected_sha na CAF e na Savy explícitas)
        env:
          PROJETO: ${{ inputs.projeto }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$PROJETO" = "ikcous-publicada" ] || [ "$PROJETO" = "savy" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
              echo "::error::Loja cliente ($PROJETO) exige expected_sha completo e igual ao GITHUB_SHA do run"; exit 1
            fi
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Cada alvo enxerga SÓ o seu segredo (mesmas expressões do job `conferir`).
      # O script recusa, antes de qualquer requisição, qualquer faixa que não seja
      # a 92-202 nas lojas explícitas, e só grava depois da pré-checagem da 8e.
      - name: Pré-confere o schema da faixa, grava o ledger e confere a leitura posterior (72-78/72-82/72-202; 50-67 na faixa 60-66)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'savy' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          PROJETO: ${{ inputs.projeto }}
          LEDGER: ${{ inputs.gravar_ledger }}
        run: node scripts/publicacao/conferir-banco.cjs

  verificar-ikcous-original:
    name: Pagamentos IKCOUS original (somente leitura)
    if: inputs.ikcous_original && !inputs.ikcous_publicado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: verificar-pagamentos-ikcous-dek
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Conferir banco original sem alterar dados
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/publicacao/verificar-pagamentos-ikcous.cjs
  verificar-ikcous-publicado:
    name: Pagamentos do site publicado CAF (somente leitura)
    if: inputs.ikcous_publicado && !inputs.ikcous_original
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: verificar-pagamentos-ikcous-caf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Conferir banco do site publicado sem alterar dados
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
        run: node scripts/publicacao/verificar-pagamentos-ikcous.cjs --site-publicado-caf