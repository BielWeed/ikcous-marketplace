# CAF usa apenas o segredo dedicado IKCOUS; sem fallback para DEK/Savy.
# Nao executar sem acesso legitimo CAF, baseline das functions e gates revisados.
# Publica edge functions do Supabase sob demanda, a partir do GitHub.
#
# POR QUE EXISTE (17/09/2026): o deploy das functions sempre foi manual, da
# máquina do dono, com `supabase functions deploy <nome> --project-ref ...`
# (DEPLOYMENT.md §2 e §5.3). Quando ninguém está com o CLI logado à mão, a
# correção fica parada no repositório enquanto a loja roda a versão velha —
# foi assim que o teste de conexão do Mercado Pago ficou falhando com a
# versão de 14/09 publicada e a correção de 15/09 parada em `develop`.
#
# O QUE ELE NÃO FAZ, DE PROPÓSITO:
#   - não dispara sozinho: só `workflow_dispatch`. Push em develop/main NÃO
#     publica nada — publicar em produção continua sendo um ato humano.
#   - não publica "todas": cada nome é validado contra supabase/functions/ e
#     o CLI recebe sempre um nome (sem nome ele publica o diretório inteiro,
#     inclusive o que ninguém revisou — DEPLOYMENT.md §2).
#   - não passa `--no-verify-jwt`: a verdade do verify_jwt de cada function é
#     `supabase/config.toml`, que o CLI lê sozinho. Flag na linha de comando
#     ganharia do arquivo, e trocar isso já derrubou o OTP uma vez (#162).
#   - não publica a `send-order-whatsapp`: despublicada em 11/08/2026, a pasta
#     fica no repositório só como registro (README dela).
#
# CREDENCIAL: o segredo `SUPABASE_ACCESS_TOKEN` do repositório (GitHub →
# Settings → Secrets and variables → Actions) é um token pessoal da conta do
# Supabase (Account → Access Tokens). Ele vale para TODOS os projetos da
# conta — por isso o destino é uma escolha fechada: o menu de `projeto` (choice) é GERADO do cadastro e o valor precisa
# ser uma chave de scripts/frota/lojas.json (hoje ikcous-publicada | savy |
# sandbox | loja; "loja desconhecida" ANTES de qualquer segredo) e o log imprime o
# ref antes de publicar. Cada loja assinante usa SOMENTE o segredo que o cadastro
# nomeia em `segredoDoToken` (Savy: `SUPABASE_ACCESS_TOKEN_SAVY`), da conta que tem
# acesso àquele projeto; as linhas de env são GERADAS do cadastro (blocos
# LOJAS-SEGREDO-UNICO).
# Revogar: na mesma página do Supabase.
#
# LOJA CLIENTE (ikcous-publicada | savy) = mesma disciplina, de
# propósito: só as cinco Functions financeiras (as do apelido `cobranca`) e
# `expected_sha` completo, igual ao SHA do run, conferido ANTES do primeiro
# deploy. Function de dinheiro numa loja de terceiro não sobe de um commit que
# ninguém aprovou. EXCEÇÃO (09/10/2026): `send-order-confirmation`, e SÓ na
# ikcous-publicada e na savy (as lojas reais). O
# comprovante do balcão divide `_shared/pedido.ts` e `_shared/comprovante.ts`
# com as financeiras, então a release trava se esses arquivos mudam e a
# function que os usa para o e-mail não pode subir. O apelido `cobranca` NÃO a
# inclui: ela só entra pelo nome. EXCEÇÃO (13/10/2026, decisão do dono): mais
# cinco functions NOMEADAS, também SÓ na ikcous-publicada e na savy:
# calculate-shipping, notify-new-order, send-otp-email, melhor-envio-etiqueta e
# send-push. Antes, uma delas que mudasse numa release deixava a loja PARADA
# pelo nome (o portão não imprimia comando). EXCEÇÃO (14/10/2026): mais uma
# NOMEADA, também SÓ na ikcous-publicada e na savy: `credenciais-email` (a lojista
# cadastra o Gmail da loja no painel; ela é admin-only, verify_jwt = true no
# config.toml). EXCEÇÃO (21/10/2026): `auth-send-email`, também só pelo nome
# nas duas lojas (Send Email Hook, verify_jwt = false; exige assinatura Standard
# Webhooks dentro da função). Nenhuma outra entra e a send-order-whatsapp continua proibida. O verify_jwt de
# cada uma é o do supabase/config.toml (o workflow nunca passa flag). A lista
# por loja que a release enxerga é
# `functionsPublicaveis` em scripts/frota/canais-de-backend.json (o teste
# tests/ci_publicar_functions_test.ts exige que as duas listas concordem). As
# tres lojas de teste foram descontinuadas pelo dono em 16/10/2026 e não têm rota aqui.
#
# Testado por tests/ci_publicar_functions_test.ts: o bloco de validação é
# extraído DESTE arquivo e rodado com bash contra os casos que importam.

name: Publicar edge functions (Supabase)

on:
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Nomes das functions, separados por vírgula ou espaço
          (ex.: credenciais-mercado-pago). "cobranca" = as cinco do Mercado Pago
          (criar-pagamento, webhook-mercadopago, reconciliar-pagamentos,
          estornar-pagamento, credenciais-mercado-pago).
        required: true
        type: string
      projeto:
        description: >-
          Destino fechado, o nome EXATO de uma loja de scripts/frota/lojas.json:
          ikcous-publicada (CAF, a loja principal no ar), savy (GNJ),
          sandbox (lof...) ou loja (DEK, projeto antigo, sem loja no ar), ou uma
          loja assinante cadastrada depois; nome desconhecido e recusado
        required: true
        type: choice
        # 03/10/2026: o padrão era `loja` (DEK), que a loja principal deixou de usar —
        # quem disparasse sem escolher publicaria no banco errado. O padrão agora é o
        # destino que está no ar, e ele é o mais travado (só as cinco financeiras e
        # as oito nomeadas, e expected_sha): esquecer de escolher vira recusa, nunca deploy no lugar errado.
        default: ikcous-publicada
        options:
          # LOJAS-OPCOES-ASSINANTES-PRIMEIRO-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          - ikcous-publicada
          - savy
          - loja
          - sandbox
          # LOJAS-OPCOES-ASSINANTES-PRIMEIRO-FIM
      expected_sha:
        description: >-
          IKCOUS publicada e Savy: SHA completo do commit aprovado, igual ao SHA deste run
        required: false
        type: string

permissions:
  contents: read

# Um deploy por projeto de cada vez, e nunca cancelado no meio: um bundle
# publicado pela metade é pior do que esperar o anterior terminar.
concurrency:
  group: publicar-functions-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publica em ${{ inputs.projeto }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve o projeto e valida os nomes
        id: alvo
        env:
          PROJETO: ${{ inputs.projeto }}
          PEDIDAS: ${{ inputs.functions }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          # Loja desconhecida PARA aqui (a mensagem sai do próprio comando, que não
          # é chamado dentro de $( ), antes de qualquer segredo). Depois disso as
          # leituras abaixo não podem falhar.
          node scripts/frota/lojas.cjs validar "$PROJETO"
          REF="$(node scripts/frota/lojas.cjs ref "$PROJETO" --functions)"
          SEGREDO="$(node scripts/frota/lojas.cjs campo "$PROJETO" segredoDoToken)"
          NOMEADAS="$(node scripts/frota/lojas.cjs campo "$PROJETO" functionsNomeadas)"
          CLIENTE=nao
          if [ "$(node scripts/frota/lojas.cjs campo "$PROJETO" classe)" = "assinante" ]; then CLIENTE=sim; fi
          if [ "$CLIENTE" = "sim" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
              echo "::error::Loja cliente ($PROJETO) exige expected_sha completo e igual ao GITHUB_SHA do run"; exit 1
            fi
          fi
          if [ "$(echo "$PEDIDAS" | tr -d '[:space:]')" = "cobranca" ]; then
            PEDIDAS="criar-pagamento webhook-mercadopago reconciliar-pagamentos estornar-pagamento credenciais-mercado-pago"
          fi
          # MODO SÓ LISTAR (só ikcous-publicada): `functions` exatamente
          # "listar" mede o que está no ar ANTES de decidir a lista de deploy.
          # Só `supabase functions list`; nenhum deploy (o expected_sha acima
          # continua exigido). Nas outras lojas "listar" segue o caminho de
          # sempre (e é recusado: não existe supabase/functions/listar).
          MODO=publicar
          if [ "$PROJETO" = "ikcous-publicada" ] && [ "$(echo "$PEDIDAS" | tr -d '[:space:]')" = "listar" ]; then
            MODO=listar
            PEDIDAS=""
          fi
          NOMES=""
          for n in $(echo "$PEDIDAS" | tr ',' ' '); do
            if ! [[ "$n" =~ ^[a-z][a-z0-9-]+$ ]]; then
              echo "::error::nome inválido: '$n' (só letras minúsculas, dígitos e hífen)"; exit 1
            fi
            if [ "$n" = "send-order-whatsapp" ]; then
              echo "::error::send-order-whatsapp foi despublicada em 11/08/2026 e não volta (DEPLOYMENT.md §2)"; exit 1
            fi
            if [ "$CLIENTE" = "sim" ]; then
              case "$n" in
                criar-pagamento|webhook-mercadopago|reconciliar-pagamentos|estornar-pagamento|credenciais-mercado-pago) ;;
                send-order-confirmation|calculate-shipping|notify-new-order|send-otp-email|melhor-envio-etiqueta|send-push|credenciais-email|auth-send-email)
                  # `functionsNomeadas` do cadastro: hoje true só na ikcous-publicada e
                  # na savy; loja nova nasce com a decisão escrita no lojas.json.
                  if [ "$NOMEADAS" != "true" ]; then
                    echo "::error::Loja cliente ($PROJETO) só admite as cinco Functions financeiras (as outras oito nomeadas só sobem na IKCOUS e na Savy)"; exit 1
                  fi ;;
                *) echo "::error::Loja cliente ($PROJETO) só admite as cinco Functions financeiras (mais as oito nomeadas: send-order-confirmation, calculate-shipping, notify-new-order, send-otp-email, melhor-envio-etiqueta, send-push, credenciais-email e auth-send-email, só na IKCOUS e na Savy)"; exit 1 ;;
              esac
            fi
            if [ ! -f "supabase/functions/$n/index.ts" ]; then
              echo "::error::não existe supabase/functions/$n/index.ts"; exit 1
            fi
            case " $NOMES " in
              *" $n "*) ;;
              *) NOMES="${NOMES:+$NOMES }$n" ;;
            esac
          done
          if [ -z "$NOMES" ] && [ "$MODO" != "listar" ]; then
            echo "::error::nenhuma function informada"; exit 1
          fi
          echo "Projeto: $PROJETO ($REF)"
          echo "Functions: $NOMES (modo: $MODO)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "segredo=$SEGREDO" >> "$GITHUB_OUTPUT"
          echo "nomes=$NOMES" >> "$GITHUB_OUTPUT"
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"

      - name: Confere o segredo
        if: inputs.projeto == 'loja' || inputs.projeto == 'sandbox'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN ausente no repositório (Settings → Secrets and variables → Actions)"; exit 1
          fi

      # LOJA ASSINANTE (todas, menos a CAF, que tem os passos próprios abaixo): o
      # token vem da cadeia gerada do cadastro — só a linha da loja pedida fica
      # preenchida, as outras dão ''.
      - name: Confere o segredo da loja assinante
        if: inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'loja' && inputs.projeto != 'sandbox'
        env:
          # LOJAS-SEGREDO-UNICO-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDO-UNICO-FIM
          SEGREDO: ${{ steps.alvo.outputs.segredo }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo $SEGREDO ausente no repositório"; exit 1
          fi

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.0.0

      # O que está no ar ANTES do deploy, registrado no resumo do run, em TODA
      # loja (26/11/2026; antes só a IKCOUS tinha, e nas outras o dono media à
      # mão — docs/runbooks/producao-unica-fonte.md): o desfazer compara com a
      # versão/updated_at de cada function neste instante. Cada passo usa o
      # MESMO token do deploy daquela loja. Se a lista falha, o passo falha e o
      # deploy (que vem depois, sem `always()`) não roda: sem registro, não há
      # desfazer. O run é o mesmo nos três passos ANTES (o teste exige).
      - name: Lista o que está no ar ANTES em loja ou sandbox
        if: inputs.projeto == 'loja' || inputs.projeto == 'sandbox'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          if ! LISTA="$(supabase functions list --project-ref "$REF")"; then
            echo "::error::não deu para listar o que está no ar em $REF ANTES do deploy; sem esse registro não há desfazer, então nada foi publicado nesta loja"
            exit 1
          fi
          {
            echo "## No ar ANTES em \`$REF\`"
            echo
            echo '```'
            printf '%s\n' "$LISTA"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lista o que está no ar ANTES na loja assinante
        if: inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'loja' && inputs.projeto != 'sandbox'
        env:
          # LOJAS-SEGREDO-UNICO-INICIO (idem)
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDO-UNICO-FIM
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          if ! LISTA="$(supabase functions list --project-ref "$REF")"; then
            echo "::error::não deu para listar o que está no ar em $REF ANTES do deploy; sem esse registro não há desfazer, então nada foi publicado nesta loja"
            exit 1
          fi
          {
            echo "## No ar ANTES em \`$REF\`"
            echo
            echo '```'
            printf '%s\n' "$LISTA"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publica, uma function por vez, sempre pelo nome
        if: inputs.projeto == 'loja' || inputs.projeto == 'sandbox'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.alvo.outputs.ref }}
          NOMES: ${{ steps.alvo.outputs.nomes }}
        run: |
          set -euo pipefail
          for n in $NOMES; do
            echo "::group::supabase functions deploy $n --project-ref $REF"
            supabase functions deploy "$n" --project-ref "$REF" --yes
            echo "::endgroup::"
          done

      # A prova somente leitura do dinheiro (27/11/2026; antes só a CAF tinha):
      # corpo e permissões das funções de cobrança, colunas do pedido e a config
      # do cartão, comparados com as migrations revisadas, ANTES de publicar
      # function de dinheiro na Savy e em toda loja nova. `--loja` leva só o
      # NOME (por env, nunca interpolado no script); o ref sai do cadastro dentro
      # do script, que recusa loja legado ou desconhecida antes de qualquer
      # fetch. Mesmo token do deploy. Se falha, o deploy (sem `always()`) não roda.
      - name: Prova somente leitura do banco da loja assinante antes de publicar
        if: inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'loja' && inputs.projeto != 'sandbox' && steps.alvo.outputs.modo != 'listar'
        env:
          # LOJAS-SEGREDO-UNICO-INICIO (idem)
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDO-UNICO-FIM
          PROJETO: ${{ inputs.projeto }}
        run: node scripts/publicacao/verificar-pagamentos-ikcous.cjs --loja "$PROJETO"

      - name: Publica loja assinante, uma function por vez
        if: inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'loja' && inputs.projeto != 'sandbox'
        env:
          # LOJAS-SEGREDO-UNICO-INICIO (idem)
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDO-UNICO-FIM
          REF: ${{ steps.alvo.outputs.ref }}
          NOMES: ${{ steps.alvo.outputs.nomes }}
        run: |
          set -euo pipefail
          for n in $NOMES; do
            echo "::group::supabase functions deploy $n --project-ref $REF"
            supabase functions deploy "$n" --project-ref "$REF" --yes
            echo "::endgroup::"
          done

      - name: Lista o que ficou publicado
        if: inputs.projeto == 'loja' || inputs.projeto == 'sandbox'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Publicado em \`$REF\`"
            echo
            echo '```'
            supabase functions list --project-ref "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lista o que ficou publicado na loja assinante
        if: inputs.projeto != 'ikcous-publicada' && inputs.projeto != 'loja' && inputs.projeto != 'sandbox'
        env:
          # LOJAS-SEGREDO-UNICO-INICIO (idem)
          SUPABASE_ACCESS_TOKEN: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDO-UNICO-FIM
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Publicado em \`$REF\`"
            echo
            echo '```'
            supabase functions list --project-ref "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Confere o segredo IKCOUS publicada
        if: inputs.projeto == 'ikcous-publicada'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN_IKCOUS ausente no repositório"; exit 1
          fi

      # O que está no ar ANTES do deploy, registrado no próprio run: o desfazer
      # das edges é redeploy do SHA anterior, e a versão/updated_at de cada
      # function no instante anterior ao deploy tem de ficar à mão. Roda
      # também no modo "listar" (que só faz isto). Mesmo run dos ANTES das
      # outras lojas (lá em cima): lista falhou, nada é publicado.
      - name: Lista o que está no ar ANTES
        if: inputs.projeto == 'ikcous-publicada'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          if ! LISTA="$(supabase functions list --project-ref "$REF")"; then
            echo "::error::não deu para listar o que está no ar em $REF ANTES do deploy; sem esse registro não há desfazer, então nada foi publicado nesta loja"
            exit 1
          fi
          {
            echo "## No ar ANTES em \`$REF\`"
            echo
            echo '```'
            printf '%s\n' "$LISTA"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prova somente leitura do banco CAF antes de publicar
        if: inputs.projeto == 'ikcous-publicada' && steps.alvo.outputs.modo != 'listar'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
        run: node scripts/publicacao/verificar-pagamentos-ikcous.cjs --site-publicado-caf

      - name: Publica IKCOUS publicada, uma function por vez
        if: inputs.projeto == 'ikcous-publicada' && steps.alvo.outputs.modo != 'listar'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
          REF: ${{ steps.alvo.outputs.ref }}
          NOMES: ${{ steps.alvo.outputs.nomes }}
        run: |
          set -euo pipefail
          for n in $NOMES; do
            echo "::group::supabase functions deploy $n --project-ref $REF"
            supabase functions deploy "$n" --project-ref "$REF" --yes
            echo "::endgroup::"
          done

      - name: Lista o que ficou publicado na IKCOUS publicada
        if: inputs.projeto == 'ikcous-publicada' && steps.alvo.outputs.modo != 'listar'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_IKCOUS }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Publicado em \`$REF\`"
            echo
            echo '```'
            supabase functions list --project-ref "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
