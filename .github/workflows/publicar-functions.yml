# Publica edge functions do Supabase sob demanda, a partir do GitHub.
#
# POR QUE EXISTE (17/09/2026): o deploy das functions sempre foi manual, da
# máquina do dono, com `supabase functions deploy <nome> --project-ref ...`
# (DEPLOYMENT.md §2 e §5.3). Quando ninguém está com o CLI logado à mão, a
# correção fica parada no repositório enquanto a loja roda a versão velha —
# foi assim que o teste de conexão do Mercado Pago ficou falhando com a
# versão de 14/09 publicada e a correção de 15/09 parada em `develop`.
#
# O QUE ELE NÃO FAZ, DE PROPÓSITO:
#   - não dispara sozinho: só `workflow_dispatch`. Push em develop/main NÃO
#     publica nada — publicar em produção continua sendo um ato humano.
#   - não publica "todas": cada nome é validado contra supabase/functions/ e
#     o CLI recebe sempre um nome (sem nome ele publica o diretório inteiro,
#     inclusive o que ninguém revisou — DEPLOYMENT.md §2).
#   - não passa `--no-verify-jwt`: a verdade do verify_jwt de cada function é
#     `supabase/config.toml`, que o CLI lê sozinho. Flag na linha de comando
#     ganharia do arquivo, e trocar isso já derrubou o OTP uma vez (#162).
#   - não publica a `send-order-whatsapp`: despublicada em 11/08/2026, a pasta
#     fica no repositório só como registro (README dela).
#
# CREDENCIAL: o segredo `SUPABASE_ACCESS_TOKEN` do repositório (GitHub →
# Settings → Secrets and variables → Actions) é um token pessoal da conta do
# Supabase (Account → Access Tokens). Ele vale para TODOS os projetos da
# conta — por isso o destino é uma escolha fechada (loja | savy | almeida |
# sandbox) e o log imprime o ref antes de publicar. Savy usa SOMENTE o segredo
# separado `SUPABASE_ACCESS_TOKEN_SAVY`, da conta que tem acesso àquele projeto.
# Almeida (loja cliente, desde 30/09/2026) está no MESMO org Supabase da loja
# principal e por isso usa o mesmo `SUPABASE_ACCESS_TOKEN` — nunca o da Savy.
# Revogar: na mesma página do Supabase.
#
# LOJA CLIENTE (savy | almeida) = mesma disciplina, de propósito: só as cinco
# Functions financeiras (as do apelido `cobranca`) e `expected_sha` completo,
# igual ao SHA do run, conferido ANTES do primeiro deploy. Function de dinheiro
# numa loja de terceiro não sobe de um commit que ninguém aprovou. As outras
# lojas clientes (Brand Meliz, Space Loja do Kit) ficam em projetos de contas
# sem acesso deste token e não têm rota aqui.
#
# Testado por tests/ci_publicar_functions_test.ts: o bloco de validação é
# extraído DESTE arquivo e rodado com bash contra os casos que importam.

name: Publicar edge functions (Supabase)

on:
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Nomes das functions, separados por vírgula ou espaço
          (ex.: credenciais-mercado-pago). "cobranca" = as cinco do Mercado Pago
          (criar-pagamento, webhook-mercadopago, reconciliar-pagamentos,
          estornar-pagamento, credenciais-mercado-pago).
        required: true
        type: string
      projeto:
        description: >-
          Destino fechado: loja (dek...), savy (gnj...), almeida (cue...)
          ou sandbox (lof...)
        required: true
        type: choice
        default: loja
        options:
          - loja
          - savy
          - almeida
          - sandbox
      expected_sha:
        description: >-
          Savy e Almeida: SHA completo do commit aprovado, igual ao SHA deste run
        required: false
        type: string

permissions:
  contents: read

# Um deploy por projeto de cada vez, e nunca cancelado no meio: um bundle
# publicado pela metade é pior do que esperar o anterior terminar.
concurrency:
  group: publicar-functions-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publica em ${{ inputs.projeto }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve o projeto e valida os nomes
        id: alvo
        env:
          PROJETO: ${{ inputs.projeto }}
          PEDIDAS: ${{ inputs.functions }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$PROJETO" in
            loja) REF=dekxabvqdsuukijblazl ;;
            savy) REF=gnjsrucsmjkajijrakzr ;;
            almeida) REF=cuemaffjmhkebhmghbap ;;
            sandbox) REF=lofznuxcvezrhxsgjqyg ;;
            *) echo "::error::projeto desconhecido: $PROJETO (use loja, savy, almeida ou sandbox)"; exit 1 ;;
          esac
          CLIENTE=nao
          case "$PROJETO" in savy|almeida) CLIENTE=sim ;; esac
          if [ "$CLIENTE" = "sim" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
              echo "::error::Loja cliente ($PROJETO) exige expected_sha completo e igual ao GITHUB_SHA do run"; exit 1
            fi
          fi
          if [ "$(echo "$PEDIDAS" | tr -d '[:space:]')" = "cobranca" ]; then
            PEDIDAS="criar-pagamento webhook-mercadopago reconciliar-pagamentos estornar-pagamento credenciais-mercado-pago"
          fi
          NOMES=""
          for n in $(echo "$PEDIDAS" | tr ',' ' '); do
            if ! [[ "$n" =~ ^[a-z][a-z0-9-]+$ ]]; then
              echo "::error::nome inválido: '$n' (só letras minúsculas, dígitos e hífen)"; exit 1
            fi
            if [ "$n" = "send-order-whatsapp" ]; then
              echo "::error::send-order-whatsapp foi despublicada em 11/08/2026 e não volta (DEPLOYMENT.md §2)"; exit 1
            fi
            if [ "$CLIENTE" = "sim" ]; then
              case "$n" in
                criar-pagamento|webhook-mercadopago|reconciliar-pagamentos|estornar-pagamento|credenciais-mercado-pago) ;;
                *) echo "::error::Loja cliente ($PROJETO) só admite as cinco Functions financeiras"; exit 1 ;;
              esac
            fi
            if [ ! -f "supabase/functions/$n/index.ts" ]; then
              echo "::error::não existe supabase/functions/$n/index.ts"; exit 1
            fi
            case " $NOMES " in
              *" $n "*) ;;
              *) NOMES="${NOMES:+$NOMES }$n" ;;
            esac
          done
          if [ -z "$NOMES" ]; then
            echo "::error::nenhuma function informada"; exit 1
          fi
          echo "Projeto: $PROJETO ($REF)"
          echo "Functions: $NOMES"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "nomes=$NOMES" >> "$GITHUB_OUTPUT"

      - name: Confere o segredo
        if: inputs.projeto != 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN ausente no repositório (Settings → Secrets and variables → Actions)"; exit 1
          fi

      - name: Confere o segredo Savy
        if: inputs.projeto == 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_SAVY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::segredo SUPABASE_ACCESS_TOKEN_SAVY ausente no repositório"; exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publica, uma function por vez, sempre pelo nome
        if: inputs.projeto != 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.alvo.outputs.ref }}
          NOMES: ${{ steps.alvo.outputs.nomes }}
        run: |
          set -euo pipefail
          for n in $NOMES; do
            echo "::group::supabase functions deploy $n --project-ref $REF"
            supabase functions deploy "$n" --project-ref "$REF"
            echo "::endgroup::"
          done

      - name: Publica Savy, uma function por vez
        if: inputs.projeto == 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_SAVY }}
          REF: ${{ steps.alvo.outputs.ref }}
          NOMES: ${{ steps.alvo.outputs.nomes }}
        run: |
          set -euo pipefail
          for n in $NOMES; do
            echo "::group::supabase functions deploy $n --project-ref $REF"
            supabase functions deploy "$n" --project-ref "$REF"
            echo "::endgroup::"
          done

      - name: Lista o que ficou publicado
        if: inputs.projeto != 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Publicado em \`$REF\`"
            echo
            echo '```'
            supabase functions list --project-ref "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lista o que ficou publicado na Savy
        if: inputs.projeto == 'savy'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_SAVY }}
          REF: ${{ steps.alvo.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Publicado em \`$REF\`"
            echo
            echo '```'
            supabase functions list --project-ref "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
