        run: node tests/banco/rodar-isolado.cjs tests/banco/a-loja-escolhe-como-entrega-viva.cjs
      # E o PORTAO da release desse lote: as consultas 47a (DEPOIS, 9 linhas) e 47b (ANTES, 9 linhas). Nao ha medicao 47m: o lote
      # so acrescenta colunas com default (nao le nem reescreve dado). BLOQUEANTE. CLONE proprio.
      - name: Prova viva do portao da entrega na cidade (consultas 47a e 47b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/a-loja-escolhe-como-entrega-portao-viva.cjs
      # A lojista renomeia e apaga categoria sem deixar produto orfao (migration 20261237, 14/10/2026; permissao + regra de
      # devolucao). A categoria do produto e' guardada pelo NOME: renomear_categoria troca o nome nos QUATRO lugares (a linha, os
      # produtos, os links de banner nos dois formatos e a lista "sem troca" da politica de devolucao) numa transacao so e conta
      # cada um; falha no meio nao deixa nada trocado; nome repetido (maiuscula, acento, pontuacao) e vazio recusam;
      # apagar_categoria_vazia recusa com o motivo enquanto houver produto, banner ou regra apontando; anon sem EXECUTE, logado
      # comum e admin rebaixado (JWT velho) recusados sem escrever; a codificacao do link e' a de encodeURIComponent; o rollback
      # apaga as onze funcoes e so elas. BLOQUEANTE. CLONE proprio.
      - name: Prova viva da gestao de categorias sem produto orfao (migration 20261237)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/categorias-gestao-viva.cjs
      # E o PORTAO da release desse lote: as consultas 38a (DEPOIS, 8 linhas) e 38b (ANTES, 6 linhas). BLOQUEANTE. CLONE proprio.
      - name: Prova viva do portao da gestao de categorias (consultas 38a e 38b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/categorias-gestao-portao-viva.cjs
      # Pedidos de privacidade da cliente (migration 20261238, dado de cliente + permissao): exclusao de conta e correcao de
      # e-mail pedidas pelo app e atendidas a mao. COMPORTAMENTO com a RLS real: a cliente le e insere so o dela, nao decide,
      # um aberto por (cliente, tipo), anon fechado, admin atual atende com carimbo do servidor, rebaixado nao, NINGUEM apaga
      # (DELETE e TRUNCATE recusados ate para o service_role), forma do e-mail, chave estrangeira sem cascata, rollback que
      # recusa apagar com pedido registrado. BLOQUEANTE. CLONE proprio.
      - name: Prova viva dos pedidos de privacidade da cliente (migration 20261238)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/pedidos-de-privacidade-viva.cjs
      # ENSAIO do roteiro de anonimizacao de conta (docs/runbooks/atender-pedido-de-privacidade.md): o SQL e LIDO do proprio
      # roteiro e roda contra uma cliente de mentira + uma vizinha. Prova: o ensaio nao grava; valendo, o dado pessoal sai e os
      # pedidos continuam com os mesmos valores; o login NAO e apagado (fica bloqueado e sem identidade); a vizinha fica
      # intacta; varredura independente nao acha mais nome/e-mail/telefone/CPF; as travas recusam. O esquema auth e emulado
      # (o roteiro marca o que so um Supabase real prova). BLOQUEANTE. CLONE proprio.
      - name: Ensaio do roteiro de anonimizacao de conta (privacidade)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/anonimizar-conta-ensaio-viva.cjs
      # E o PORTAO da release desse lote: as consultas 39a (DEPOIS, 19 linhas), 39b (ANTES, 9 linhas, com o REFERENCES do papel que aplica
      # em auth.users) e a medicao 39m (rol aberto, so catalogo: o que o postgres da loja pode fazer nas tabelas de login do roteiro
      # manual; o roteiro NAO roda aqui nem no lote). Rol exato em todos os estados, um defeito por vez reprovando SO a sua linha,
      # o veredito do conferir-banco.cjs. BLOQUEANTE. CLONE proprio.
      - name: Prova viva do portao dos pedidos de privacidade (consultas 39a e 39b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/pedidos-de-privacidade-portao-viva.cjs
      # A loja PODE declarar razao social, CNPJ/CPF e e-mail de atendimento (migration 20261239, aditiva e opcional; decisao do
      # dono de 14/10/2026). COMPORTAMENTO com os papeis reais: salvar um dos tres nao apaga horario, endereco, descricao nem os
      # outros dois (e salvar qualquer outro campo nao apaga os tres); null limpa so o campo pedido; a CHECK de forma recusa
      # vazio, 201 caracteres, documento com mascara ou minusculo e e-mail sem forma (o digito verificador e' do app); so o admin
      # ATUAL grava (cliente, visitante e admin rebaixado recusados sem escrever); o visitante le pela view e pela tabela e nao
      # escreve; a view publica so ganha as 3 colunas; ida e volta com o corpo da 20261199 byte a byte e o ACL da view igual; o
      # rollback recusa se a loja ja preencheu algum campo; pre-voo que recusa sem escrever; mutantes. BLOQUEANTE. CLONE proprio.
      - name: Prova viva da identidade legal da loja (migration 20261239)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/loja-declara-quem-e-viva.cjs
      # E o PORTAO da release desse lote: as consultas 40a (DEPOIS, 11 linhas), 40b (ANTES, 10 linhas, com o ACL da view que o rollback recria) e a medicao 40m (rol aberto). BLOQUEANTE. CLONE proprio.
      - name: Prova viva do portao da identidade legal da loja (consultas 40a e 40b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/loja-declara-quem-e-portao-viva.cjs
      # L8 da auditoria de 12/10: FUNCAO NOVA DE BANCO NAO NASCE ABERTA. Com TODAS as migrations aplicadas do zero,
      # lista toda funcao de `public` que alguem de fora executa (anon, authenticated ou PUBLIC, inclusive funcao de
      # extensao) e REPROVA se alguma nao esta na lista versionada tests/banco/portas-do-visitante-permitidas.json (que
      # bate com as duas lojas reais), se uma da lista mudou QUEM executa, o tipo ou o SECURITY DEFINER, se a lista
      # repete linha ou aponta funcao que nao existe mais. Um autoteste prova que o detector enxerga a funcao sem
      # REVOKE, a com REVOKE so de PUBLIC, a que deixou o authenticated aberto e a de extensao. So le o catalogo.
      # O job reprova (nao e check obrigatorio do ruleset). CLONE proprio.
      - name: Prova viva de que funcao nova nao nasce aberta (lista de portas de funcao permitidas)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/portas-do-visitante-so-as-permitidas-viva.cjs
      # Onda I do painel simples (20261212 a 20261214): o estoque baixo e uma regua so (Inicio, lista, analytics),
      # o valor do estoque so conta produto com custo, a receita do mes e caracterizada (sem migration) e o estoque
      # minimo e editavel so pelo admin. Cada prova clona o banco.
      - name: Prova viva do estoque baixo numa regua so (migrations 20261212 e 20261213)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/estoque-baixo-uma-regra-viva.cjs
      - name: Prova viva do lucro do estoque so com custo (migration 20261214)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/inventario-so-com-custo-viva.cjs
      - name: Prova viva do portao da 8e com as sucessoras da 99 (migrations 20261212 e 20261214)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/portao-8e-aceita-sucessoras-viva.cjs
      - name: Prova viva de caracterizacao da receita do mes (sem migration)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/receita-uma-regua-viva.cjs
      - name: Prova viva do estoque minimo editavel so pelo admin (sem migration, transacao desfeita)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/estoque-minimo-editavel-viva.cjs
      # AUDITORIA DE PAGAMENTO E SEGURANCA, fase A (10/10/2026): MEDICAO de "o que um estranho faz com as
      # portas abertas". Cada script reabre, de proposito, o EXECUTE do visitante sem login (GRANT ... TO
      # anon) para cada funcao da lista, chama como anon com dados SINTETICOS criados na propria
      # transacao (controle legitimo antes, para provar a fixture) e registra a linha
      # `PORTA <recurso> -> escreveu|vazou|recusou|executou|inconclusivo|AUSENTE <detalhe>`; tudo termina
      # em ROLLBACK. NAO sao portao: saem sempre 0 (o resultado e a tabela no log e no resumo do job);
      # um AUTOTESTE no inicio prova que o classificador enxerga escrita, vazamento e recusa, e sem ele a
      # tabela vem marcada "MEDICAO INVALIDA". Para ler: `gh run view <id> --log` e procurar `PORTA`. Na
      # fase B (correcao) viram teste de regressao: o esperado muda de "escreveu/vazou" para "recusou"
      # SO nas portas com aberta_no_repo=nao; as de convidado (v23/v24, OTP) continuam abertas por desenho.
      # CLONE proprio (rodar-isolado.cjs), antes da prova que escreve no banco base.
      - name: Medicao das portas do anonimo - dinheiro (A5a, nao e portao)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/portas-anon-exploracao-dinheiro.cjs
      - name: Medicao das portas do anonimo - dados pessoais (A5b, nao e portao)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/portas-anon-exploracao-dados.cjs
      - name: Medicao das portas do anonimo - estoque, OTP e servico (A5c, nao e portao)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/portas-anon-exploracao-estoque-otp.cjs
      - name: Prova viva do lancamento idempotente (20261246000000, concorrencia e mutantes)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/lancamento-idempotente-viva.cjs
      - name: Prova viva da anotacao interna do pedido (20261247000000, papeis reais e mutantes)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/nota-interna-do-pedido-viva.cjs
      - name: Prova viva da coluna notes do pedido fechada ao painel (20261248000000, papeis reais e mutantes)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/notes-do-pedido-fechada-viva.cjs
      - name: Prova viva do motivo privado do desconto do balcao (20261249000000, papeis reais e mutantes)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/pdv-motivo-privado-viva.cjs
      - name: Prova viva do total conferido do balcao (20261280000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/pdv-total-conferido-viva.cjs
      - name: Prova os invariantes de dinheiro
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/invariantes-dinheiro.cjs
      # send-order-whatsapp (04/10/2026): cada `.from().select()` da edge é
      # executado no schema real — coluna removida (as `whatsapp_api_*` de
      # store_config) reprova, em vez de passar num dublê de banco.
      - name: Prova viva das consultas da send-order-whatsapp
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/whatsapp-edge-consultas-viva.cjs

  provas-informacionais:
    name: Provas vivas que não são dinheiro (informacionais)
    runs-on: ubuntu-latest
    # INFORMACIONAL: não barra o PR, mas o vermelho continua visível no run.
    continue-on-error: true
    timeout-minutes: 10

    services:
      postgres:
        # PG 17: a versão do projeto (ADR 0003; o Supabase do projeto roda 17)
        # — mesma imagem do db-ci.yml da ci-banco.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ÚNICA conexão deste job: o service efêmero acima. A trava de
      # tests/banco/efemero.cjs recusa qualquer outro alvo.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI_BANCO_EFEMERO: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Só pelo pacote `pg` (dependência do repositório, usada pelo job
      # "objetos" do ci.yml).
      - run: npm ci
      - name: Provisiona o efêmero (fábrica do Supabase, emulada)
        run: node tests/banco/provisionar.cjs
      - name: Aplica as migrations do zero
        run: node tests/banco/aplicar-migrations.cjs supabase/migrations
      - name: Prova viva do CRM e do Início
        run: node tests/banco/rodar-isolado.cjs tests/banco/crm-inicio-viva.cjs
      # Migration 20261183000000 (o CRM vê todo mundo): "Todos os clientes"
      # passa a listar quem pediu e não pagou e quem nunca comprou — CLONE
      # próprio (rodar-isolado.cjs), mesmo motivo do CRM/Início acima.
      - name: Prova viva do CRM vê todo mundo (migration 20261183000000)
        run: node tests/banco/rodar-isolado.cjs tests/banco/crm-todos-viva.cjs
      # Migration 20261182000000 (revisão de risco, rodada 2, achado 2): o
      # cpf_ok/gravação da migration de dados compara contra o BLOCO DE CPF
      # extraído do prosrc VIVO de create_marketplace_order_v24, em milhares
      # de entradas fictícias -- 0 divergências.
      - name: Prova viva do CPF da janela (migration 20261182000000)
        run: node tests/banco/rodar-isolado.cjs tests/banco/cpf-da-janela-viva.cjs
