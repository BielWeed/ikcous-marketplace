      - "scripts/publicacao/consultas/51b-antes-notes-do-pedido-base-vigente.sql"
      - "scripts/publicacao/consultas/52a-conferir-motivo-do-balcao-privado-aplicado.sql"
      - "scripts/publicacao/consultas/52b-antes-motivo-do-balcao-base-vigente.sql"
      - "scripts/publicacao/consultas/53a-conferir-faturamento-potencial-aplicado.sql"
