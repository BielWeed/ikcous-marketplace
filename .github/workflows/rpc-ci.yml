      - "scripts/frota/publicar-release.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpc-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma versão do ci.yml e do db-ci.yml (produção roda Node 24.x).
  NODE_VERSION: "24"

jobs:
  contrato-dinheiro:
    name: Invariantes de dinheiro (Postgres efêmero) — bloqueante
    runs-on: ubuntu-latest
    # BLOQUEANTE (sem continue-on-error): prova de dinheiro vermelha barra o PR.
    timeout-minutes: 15

    services:
      postgres:
        # PG 17: a versão do projeto (ADR 0003; o Supabase do projeto roda 17)
        # — mesma imagem do db-ci.yml da ci-banco.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ÚNICA conexão deste job: o service efêmero acima. A trava de
      # tests/banco/efemero.cjs recusa qualquer outro alvo.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI_BANCO_EFEMERO: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Só pelo pacote `pg` (dependência do repositório, usada pelo job
      # "objetos" do ci.yml).
      - run: npm ci
      - name: Provisiona o efêmero (fábrica do Supabase, emulada)
        run: node tests/banco/provisionar.cjs
      - name: Aplica as migrations do zero
        id: aplica
        run: node tests/banco/aplicar-migrations.cjs supabase/migrations
      - name: Gera tipos do schema public efêmero
        id: tipos
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/gerar-tipos-efemeros.cjs
      - name: Guarda tipos do schema public efêmero
        if: ${{ !cancelled() && steps.tipos.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: tipos-public-${{ github.sha }}
          path: ${{ runner.temp }}/tipos-efemeros
          if-no-files-found: error
          retention-days: 1
      # TODAS as provas abaixo rodam mesmo depois de uma vermelha (R2 da
      # revisão Opus de 14d77a5b): sem isto, a 1a prova que falha esconde as
      # seguintes (o "pulado" do Actions), e um vermelho conhecido numa prova
      # deixava as de admin-atual, contestação e invariantes sem rodar. O job
      # continua FALHANDO se qualquer uma falhar — nada de continue-on-error;
      # `!cancelled()` só troca o "pare no primeiro erro" por "rode todas e
      # reprove no fim". Sem as migrations aplicadas, nenhuma prova roda (o
      # passo `aplica` já reprovou o job).
      - name: Prova viva dos icones de categoria e ACL preservada (300)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/categorias-icones-viva.cjs
      - name: Prova viva da forma do icone de categoria e ACL preservada (351)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/forma-do-icone-viva.cjs
      # Intencao do caixa (frente caixa-db, plano 2026-10-20-noturno-onda2-caixa-db, CX1/CX2):
      # CX1 = retry do fechamento de S1 depois que S2 abriu nao pode tocar S2; CX2 = sangria
      # de 50 (saldo 300) repetida com a mesma chave grava UMA transferencia. O seletor
      # CAIXA_INTENCAO_ALVO e' do INSTRUMENTO (qual RPC a prova chama), nao do banco nem da
      # guarda. ETAPA A (RED observado no run 39418487244, SHA 4a909274): alvo `legado` caiu
      # em [DANO] em CX1 e CX2. ETAPA B: alvo `chave` (migration 20261252000000) -> CX1/CX2
      # passam e o legado segue como CONTROLE explicito dentro da prova. CLONE proprio.
      - name: Prova viva da intencao do caixa (CX1/CX2, alvo chave)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        env:
          CAIXA_INTENCAO_ALVO: chave
        run: node tests/banco/rodar-isolado.cjs tests/banco/caixa-intencao-viva.cjs
      # Portao 56: base anterior do zero, apply real, CHECK afrouxada e rollback em banco novo.
      # BLOQUEANTE; so o Postgres efemero do job, com os mesmos gatilhos das consultas 56a/56b.
      - name: Prova viva do portao do motivo da recusa do cartao (consultas 56a e 56b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/motivo-da-recusa-portao-viva.cjs
      # Receita com custo usa preco efetivo por variante (251): cobertura, zero legitimo,
      # prejuizo, contrato historico, portoes oficiais, rollback e mutantes. CLONE proprio.
      - name: Prova viva do lucro do estoque (migration 20261251)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/lucro-do-estoque-viva.cjs
      # A prova nova roda primeiro em clone próprio; não depende das fixtures das demais.
      - name: Prova viva do faturamento potencial (migration 20261250)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/faturamento-potencial-viva.cjs
      # Provas vivas de 26/09 (devoluções, cartão, Financeiro, CRM/Início):
      # cada uma num CLONE do banco recém-migrado (rodar-isolado.cjs) — as do
      # Financeiro e do CRM medem totais da loja e não podem enxergar as
      # fixtures de outra prova. Ficam ANTES das que escrevem no banco base.
      - name: Prova viva das devoluções
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/devolucoes-viva.cjs
      - name: Prova viva do cartão online
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/cartao-online-viva.cjs
      - name: Prova viva do contato privado do mototaxi
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/mototaxi-viva.cjs
      - name: Prova viva do estilo do card de frete
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/estilo-card-frete-viva.cjs
      - name: Prova viva do Financeiro
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/financeiro-viva.cjs
      # confirmar_pagamento e registrar_pagamento_recebido (as duas RPCs que
      # escrevem o payment_status): transições, devolução de estoque uma vez,
      # expiração, permissão por papel e CONCORRÊNCIA com duas conexões reais
      # — CLONE próprio (rodar-isolado.cjs), as fixtures não vazam.
      - name: Prova viva dos pagamentos (confirmar_pagamento e registrar_pagamento_recebido)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/pagamentos-rpc-viva.cjs
      # Migration 20261197000000 (o dinheiro exige o admin de agora): admin
      # rebaixado com JWT velho — nas duas direções da contradição auth.users
      # × profiles — é recusado nas seis RPCs sem escrever nada e não lê
      # pedido nem ledger alheio; controle sem a guarda escreve; rollback
      # byte a byte e preflights recusando sem escrita. CLONE próprio.
      - name: Prova viva do admin atual no dinheiro (migration 20261197000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/admin-atual-viva.cjs
      # Migration 20261199000000 (as portas do painel exigem o admin de
      # agora): a autopromoção do rebaixado só no app_metadata falha; o
      # ex-admin com JWT velho é recusado nas 39 RPCs do painel (dado de
      # cliente, números da loja, caixa, estoque, config) com a recusa de
      # sempre; admin, dono, service_role e postgres como antes; controles sem
      # a correção passam; rollback só troca os 42 corpos. CLONE próprio.
      - name: Prova viva do admin atual nas portas do painel (migration 20261199000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/admin-atual-portas-viva.cjs
      # Migration 20261200000000 (a decisão da devolução exige o admin de
      # agora): o ex-admin com JWT velho (rebaixado só no profiles ou só no
      # auth.users) é recusado em admin_devolucao_decidir/registrar/reprovar
      # com a recusa de sempre e SEM escrever; admin, service_role e postgres
      # como antes; cliente e anon recusam; controle sem a guarda escreve;
      # rollback só troca os 3 corpos. CLONE próprio.
      - name: Prova viva do admin atual na decisão da devolução (migration 20261200000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/admin-atual-devolucao-viva.cjs
      # Migration 20261202000000 (as políticas de RLS do pedido, da devolução e
      # do financeiro exigem o admin de agora): nas 14 políticas, o ex-admin
      # com JWT velho lê 0 linhas e não escreve; controle na política antiga
      # lê e escreve; admin atual como antes; dono lê o que é dele e terceiro
      # não; rollback só troca a porta. CLONE próprio.
      - name: Prova viva do admin atual nas políticas de RLS (migration 20261202000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/admin-atual-rls-viva.cjs
      # Migration 20261196000000 (Lote A): a contestação decide sob a trava do
      # pedido — corridas REAIS entre duas conexões (a 2ª comprovadamente
      # parada na trava), estimativa que só reserva, multicaso, refund regular
      # numa order contestada. CLONE próprio.
      - name: Prova viva da contestação (migration 20261196000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/contestacao-viva.cjs
      # Migration 20261198000000 (S1): cancelar pedido online com cobrança
      # aberta só pela edge, que anula no MP antes; o banco cancela por RPC
      # com CAS, devolve o REMANESCENTE do estorno (R11) e o entregue não
      # devolve estoque — com duas conexões reais na ordem global de travas.
      # CLONE próprio.
      - name: Prova viva do cancelamento que anula a cobrança (migration 20261198000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/cancelar-pedido-viva.cjs
      # A ORDEM GLOBAL DAS TRAVAS composta (linhas de order_refunds do pedido
      # por id -> marketplace_orders): cada par de RPCs que mexem no ledger
      # (contestação/REF externo/autorização da 96, concluir_estorno, estorno
      # manual, cancelamento da 98, reemissão da devolução) com DUAS conexões
      # reais — a 2ª parada em Lock, nenhum 40P01 — e um ciclo de TRÊS
      # conexões; cada caso tem o CONTROLE com o pedido travado primeiro, que
      # dá 40P01. CLONE próprio.
      - name: Prova viva da ordem das travas composta (96, 97, 98 e reemissão)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/ordem-das-travas-composta-viva.cjs
      # O ENVELOPE do aplicar-migrations.yml (impressão digital no limite de
      # cada DDL: REPEATABLE READ, FP antes/depois, RAISE antes do COMMIT) e o
      # gate de transporte: o trecho do workflow é extraído e executado aqui
      # contra um Postgres de verdade — as 10 migrations 92..202 e a cadeia de
      # rollback-manual passam; mutantes (UPDATE/INSERT/DELETE de topo, DROP de
      # coluna/tabela, coluna nova com valor, COMMIT de topo) são recusados
      # com nada gravado. Monta o SEU banco-base pré-92 (CLONE próprio).
      - name: Prova viva da impressão digital do apply (envelope do aplicar-migrations)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/impressao-digital-viva.cjs
      # Lote 60-66 (06/10/2026): a consulta 9a (prova por OBJETO das migrations
      # 20261160..20261166, que nunca se reaplicam) e o backfill ledger-60-66 —
      # positivo na árvore final, controle negativo pré-60, defeitos isolados
      # (índice, CHECK, UNIQUE, FK, gatilho, default, vista, ACL, overload,
      # corpo antigo) reprovando a linha certa, INSERT guardado 0→7→0 e o
      # conferir-banco.cjs ponta a ponta. Monta o SEU banco-base (CLONE próprio).
      - name: Prova viva do lote 60-66 (consulta 9a + backfill do ledger)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/lote-60-66-viva.cjs
      # 8k (07/10/2026): a conferência de subtotal do portão da Savy — a 8c com a
      # prova de loja VAZIA. Executada num Postgres real, como papel de leitura
      # (bypass, sem bypass com RLS ativa, dono, só-coluna, superuser): vazia provada
      # SÓ com RLS não ativa e SELECT de tabela inteira nas duas tabelas; com dados
      # reproduz a 8c; metadado errado (tipo, relkind, privilégio) e tabela ausente
      # NÃO são positivos; o conferir-banco.cjs de verdade a executa ponta a ponta.
      # BLOQUEANTE (job do dinheiro): o portão do apply do lote 92-202 depende dela.
      # CLONE próprio (rodar-isolado.cjs).
      - name: Prova viva da 8k (subtotal divergente, ou vazia PROVADA)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/subtotal-vazia-provada-viva.cjs
      # Cupons desligados (migration 20261203000000, issue #645, 08/10/2026):
      # com store_config.enable_coupons IS FALSE nenhum pedido novo nasce com
      # cupom (gatilho BEFORE INSERT em marketplace_orders, pela v24 E pela
      # v23) e a validação recusa com o motivo; ligada/NULL/sem linha segue como
      # antes; o retry idempotente de pedido criado antes devolve o mesmo
      # pedido; ACL e rollback byte a byte; mutantes (sem gatilho, IS NOT TRUE,
      # validação sem a checagem) ficam vermelhos. CLONE próprio.
      - name: Prova viva dos cupons desligados (migration 20261203000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/cupons-desligados-viva.cjs
      # Portao da release para a migration 20261203000000 (cupons desligados,
      # issue #645, 08/10/2026): as consultas 10a (DEPOIS) e 10b (ANTES) do lote
      # em scripts/frota/canais-de-backend.json, executadas num Postgres real como
      # papel de leitura. 10b positiva num banco montado SEM a migration; 10a
      # positiva depois do apply real (e com os corpos em CRLF); defeitos
      # isolados (gatilho ausente/desabilitado/sem WHEN/outro evento, corpo
      # divergente de 1 byte, funcao sem search_path, EXECUTE para PUBLIC, indice
      # unico ausente ou de outra forma) reprovam cada um a SUA linha e levam o
      # portao a NEGATIVA, nunca a POSITIVA; mutantes da consulta (sem o hash, sem o
      # WHEN, sem o habilitado) deixam um negativo passar e a prova ficaria
      # vermelha; erro de SQL nao vira positivo. BLOQUEANTE: o portao de CADA loja
      # depende dela. Monta o SEU banco-base pre-203 (CLONE proprio).
      - name: Prova viva do portao dos cupons desligados (consultas 10a e 10b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/cupons-desligados-portao-viva.cjs
      # Anular venda do balcão (migration 20261204000000, 08/10/2026): só o admin
      # de AGORA (o funcionário rebaixado com o JWT ainda dizendo admin é recusado
      # sem escrever, nas duas fontes do papel), só canal presencial, só no mesmo dia
      # da loja (as duas bordas da virada, qualquer fuso de sessão), motivo
      # obrigatório, sem devolução nem estorno do app, estoque devolvido UMA vez
      # (inclusive com duas conexões reais), Financeiro e caixa fechando em zero,
      # ordem global das travas, pré-voo e rollback; cada guarda tirada (mutante)
      # deixa a prova vermelha. CLONE próprio.
      - name: Prova viva de anular a venda do balcão (migration 20261204000000)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
        run: node tests/banco/rodar-isolado.cjs tests/banco/anular-venda-viva.cjs
      # Portão da release para a migration 20261204000000: as consultas 11a (DEPOIS)
      # e 11b (ANTES) do lote em scripts/frota/canais-de-backend.json, executadas num
      # Postgres real como papel de leitura. 11b positiva num banco SEM a função; 11a
      # positiva depois do apply real (LF e CRLF); cada defeito (SECURITY INVOKER, sem
      # search_path, EXECUTE para PUBLIC/anon/service_role, authenticated revogado, corpo
      # com 1 byte a mais, sobrecarga extra, função ausente) reprova a SUA linha e leva o
      # portão a NEGATIVA, nunca a POSITIVA; mutantes da consulta ficam vermelhos; erro de
      # SQL não vira positivo; ponta a ponta com o conferir-banco.cjs e o lote real:
      # APLICAR, NADA ou PARAR. BLOQUEANTE: o portão de CADA loja depende dela. CLONE próprio.
      - name: Prova viva do portão de anular a venda do balcão (consultas 11a e 11b)
        if: ${{ !cancelled() && steps.aplica.outcome == 'success' }}
