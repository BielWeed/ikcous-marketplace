      - "scripts/publicacao/consultas/60a-conferir-estilo-card-frete-aplicado.sql"
      - "scripts/publicacao/consultas/60b-antes-estilo-card-frete-base-vigente.sql"
      - "scripts/publicacao/consultas/61a-conferir-icones-das-categorias-aplicado.sql"
      - "scripts/publicacao/consultas/61b-antes-icones-das-categorias.sql"
      - "scripts/publicacao/consultas/62a-conferir-mototaxi-aplicado.sql"
      - "scripts/publicacao/consultas/62b-antes-mototaxi-ausente.sql"
      - "scripts/publicacao/consultas/63a-conferir-forma-do-icone-aplicado.sql"
      - "scripts/publicacao/consultas/63b-antes-forma-do-icone-ausente.sql"
      - "scripts/publicacao/consultas/8e-conferir-92-a-202-aplicado.sql"
      - "scripts/publicacao/consultas/ledger-92-202.sql"
