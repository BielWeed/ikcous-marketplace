# Confere, SÓ LEITURA, se o banco de UMA loja assinante tem todo objeto que o
# código usa (tabela/view de `.from(...)`, função de `.rpc(...)`, bucket) e se os
# papéis do app o alcançam. É o mesmo detector do job `objetos` do ci.yml
# (scripts/db-check-objetos-do-codigo.mjs, BANCO-080/#139: a view que sumiu do
# banco e quebrou o cadastro de produto em produção), apontado para a loja
# escolhida. Nasceu em 27/11/2026 (A19 do plano da org central): com a frota
# crescendo, o banco de cada loja precisa da mesma conferência que a IKCOUS tem.
#
# POR QUE UM WORKFLOW À PARTE: o job `objetos` do PR continua só na IKCOUS, que
# é a loja de desenvolvimento. Rodar todas as lojas a cada PR seria caro e
# instável; aqui é UMA loja por execução, escolhida no menu.
#
# PROJETO: menu fechado (choice) GERADO de scripts/frota/lojas.json (só lojas
# assinantes) e VALIDADO de novo contra ele antes de qualquer segredo. Nunca um
# ref de texto livre: o script recebe só `--loja <nome>` e tira o ref E o nome do
# segredo do cadastro; loja legado ou desconhecida é recusada antes de qualquer
# fetch.
#
# CREDENCIAL: nenhuma nova. Cada loja usa o segredo que o cadastro nomeia em
# `segredoDoToken`, e o script só lê ESSE (o de outra loja não serve). As linhas
# de segredo são GERADAS do cadastro (bloco LOJAS-SEGREDOS): cada alvo enxerga só
# o seu, o vizinho vem ''. O segredo só existe no ÚLTIMO passo.
#
# GATILHO: só `workflow_dispatch`. Nenhum `pull_request_target`, nenhum código de
# PR roda aqui com segredo. `expected_sha` é OBRIGATÓRIO (40 hex, igual ao SHA do
# run) e é conferido no PRIMEIRO passo, antes do checkout e de qualquer rede.
# Sem agenda por enquanto: uma agenda não tem `inputs`, e escolher QUAIS lojas
# um disparo agendado confere é decisão que ainda não foi tomada.
#
# USO (gh):
#   gh workflow run objetos-da-frota.yml --repo BielWeed/ikcous-marketplace \
#     --ref <ramo> -f projeto=savy -f expected_sha=<SHA completo do topo do ramo>
#
# Testado por tests/ci_objetos_do_codigo_test.ts.

name: Objetos do banco da loja
run-name: "objetos do banco em ${{ inputs.projeto }}"

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "Loja a conferir: o nome EXATO de uma loja assinante de scripts/frota/lojas.json; loja desconhecida e recusada antes de qualquer segredo"
        required: true
        type: choice
        default: savy
        options:
          # LOJAS-OPCOES-ASSINANTES-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          - ikcous-publicada
          - savy
          # LOJAS-OPCOES-ASSINANTES-FIM
      expected_sha:
        description: "OBRIGATORIO: o SHA completo (40 hex) do commit deste run (igual ao GITHUB_SHA)"
        required: true

permissions:
  contents: read

concurrency:
  group: objetos-da-frota-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  objetos:
    name: Objetos do banco em ${{ inputs.projeto }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PRIMEIRO passo, antes de checkout e de qualquer requisição: expected_sha
      # completo e igual ao GITHUB_SHA (o mesmo padrão de medir-auth-da-loja.yml).
      # Não vê segredo.
      - name: Confere o alvo (expected_sha completo e igual ao do run)
        env:
          PROJETO: ${{ inputs.projeto }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ! [[ "$PROJETO" =~ ^[a-z][a-z0-9-]{1,39}$ ]]; then
            echo "::error::loja desconhecida (nome fora do formato)"; exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]; then
            echo "::error::Loja cliente ($PROJETO) exige expected_sha completo e igual ao GITHUB_SHA do run"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # O caminho pela API não usa `pg` (só o modo local por DATABASE_URL usa):
      # nenhum `npm ci` aqui.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A loja existe no cadastro (scripts/frota/lojas.json) e e ASSINANTE? Recusa
      # ("loja desconhecida") ANTES do passo que ve segredo. Nao le segredo.
      - name: Confere a loja no cadastro (lojas.json) antes de qualquer segredo
        id: loja
        env:
          PROJETO: ${{ inputs.projeto }}
        run: node scripts/frota/lojas.cjs validar "$PROJETO" --assinante --saida-do-passo

      # Cada alvo enxerga SÓ o seu segredo: segredo vazio dá '', nunca o do
      # vizinho. É o ÚNICO passo com segredo; o script PARA sem o da própria loja.
      - name: Confere os objetos que o código usa contra o catálogo do banco da loja
        env:
          # LOJAS-SEGREDOS-INICIO (gerado de scripts/frota/lojas.json por scripts/frota/lojas-nos-workflows.cjs --escrever; nao editar a mao)
          SUPABASE_ACCESS_TOKEN_IKCOUS: ${{ inputs.projeto == 'ikcous-publicada' && secrets.SUPABASE_ACCESS_TOKEN_IKCOUS || '' }}
          SUPABASE_ACCESS_TOKEN_SAVY: ${{ inputs.projeto == 'savy' && secrets.SUPABASE_ACCESS_TOKEN_SAVY || '' }}
          # LOJAS-SEGREDOS-FIM
          PROJETO: ${{ inputs.projeto }}
        run: node scripts/db-check-objetos-do-codigo.mjs --loja "$PROJETO"
