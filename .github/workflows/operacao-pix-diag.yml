# Temporário (28/09/2026): SÓ LEITURA na loja principal — por que o Pix de
# R$ 1 do dono ficou aguardando confirmação.
name: Operação — diagnóstico do Pix (temporário)
on:
  push:
    branches: [infra/operacao-incidente]
    paths:
      - scripts/incidente/pix-diag.mjs
      - .github/workflows/operacao-pix-diag.yml
permissions:
  contents: read
jobs:
  pix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/incidente/pix-diag.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
