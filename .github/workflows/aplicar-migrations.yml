name: Aplicar migrations (Supabase)

# Aplica migrations NO PROJETO ALVO pela API de gestão do Supabase, com a
# disciplina da casa: para cada arquivo roda primeiro a PROVA
# (BEGIN; <sql>; ROLLBACK;) e só então o apply; no fim, verifica que as RPCs
# novas existem e estão alcançáveis por authenticated. Cada projeto usa o
# mesmo segredo que já publica suas functions; Savy usa o token próprio.
#
# Só roda a PEDIDO (workflow_dispatch), nunca em push. A impressão digital do
# banco vem antes de qualquer DDL.
#
# USO: Actions → Run workflow → migracoes = arquivos de supabase/migrations/
# separados por vírgula, NA ORDEM (fila serializada). Vazio = só fingerprint.

on:
  workflow_dispatch:
    inputs:
      migracoes:
        description: "Arquivos em supabase/migrations/ (vírgula, na ordem; vazio = só fingerprint)"
        required: false
        default: ""
      projeto:
        description: "Destino fechado: loja, savy ou sandbox (nunca um ref livre)"
        required: false
        type: choice
        default: loja
        options:
          - loja
          - savy
          - sandbox
      expected_sha:
        description: "Savy: SHA completo do commit aprovado, igual ao SHA deste run"
        required: false
        type: string

jobs:
  aplicar:
    name: Aplicar migrations
    runs-on: ubuntu-latest
    # Mesmo grupo de conferir-banco-da-loja.yml (job `ledger`): nunca aplicar
    # migration enquanto o ledger está sendo gravado, nem o contrário.
    concurrency:
      group: banco-da-loja
      cancel-in-progress: false
      # queue: max (não o default "single"): sem isto, disparar A (72),
      # depois B (73) e C (74) cancela B e aplica só A e C, fora de ordem —
      # achado da rodada 3 da revisão de risco do conferir-banco-da-loja.
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: "Prova, apply e verificação"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets[inputs.projeto == 'savy' && 'SUPABASE_ACCESS_TOKEN_SAVY' || 'SUPABASE_ACCESS_TOKEN'] }}
          MIGRACOES: ${{ inputs.migracoes }}
          PROJETO: ${{ inputs.projeto }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node -e "
            const fs = require('node:fs');
            // RESOLVE_REF_INICIO — projeto virou choice loja/savy/sandbox (nunca
            // mais texto livre no path da URL): achado da revisão de risco
            // do conferir-banco-da-loja, rodada 2 — 'projeto_ref' cru
            // habilitava '<ref>/restart#' (POST para outro endpoint) e
            // 'x/../outroref.../database/query#' (a query indo para OUTRO
            // projeto), com um token válido para toda a conta.
            const REFS = { loja: 'dekxabvqdsuukijblazl', savy: 'gnjsrucsmjkajijrakzr', sandbox: 'lofznuxcvezrhxsgjqyg' };
            const projeto = process.env.PROJETO;
            if (!Object.hasOwn(REFS, projeto)) {
              console.error('RECUSADO (projeto desconhecido): ' + projeto); process.exit(1);
            }
            if (projeto === 'savy') {
              const expected = process.env.EXPECTED_SHA || '';
              const actual = process.env.GITHUB_SHA || '';
              if (!/^[a-fA-F0-9]{40}\$/.test(expected) || expected.toLowerCase() !== actual.toLowerCase()) {
                console.error('RECUSADO (Savy exige expected_sha completo e igual ao GITHUB_SHA do run)'); process.exit(1);
              }
            }
            const ref = REFS[projeto];
            if (!/^[a-z]{20}\$/.test(ref)) {
              console.error('RECUSADO (ref inválido): ' + ref); process.exit(1);
            }
            // RESOLVE_REF_FIM
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            if (!token) { console.error('SEM TOKEN DO PROJETO ' + projeto); process.exit(1); }

            async function sql(titulo, query) {
              const r = await fetch(
                'https://api.supabase.com/v1/projects/' + ref + '/database/query',
                {
                  method: 'POST',
                  headers: {
                    Authorization: 'Bearer ' + token,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ query }),
                },
              );
              const corpo = await r.text();
              if (!r.ok) throw new Error(titulo + ' -> HTTP ' + r.status + ': ' + corpo.slice(0, 300));
              if (corpo.includes('\"error\"') || corpo.includes('\"message\":\"')) {
                throw new Error(titulo + ' -> ' + corpo.slice(0, 300));
              }
              return corpo;
            }

            function exigirTudoVerdadeiro(titulo, resposta) {
              let linhas;
              try { linhas = JSON.parse(resposta); } catch {
                throw new Error(titulo + ': resposta de verificação não é JSON');
              }
              if (!Array.isArray(linhas) || linhas.length !== 1 ||
                  !linhas[0] || typeof linhas[0] !== 'object' ||
                  Object.keys(linhas[0]).length === 0) {
                throw new Error(titulo + ': esperado um registro de verificações booleanas');
              }
              const falhas = Object.entries(linhas[0])
                .filter(([, valor]) => valor !== true)
                .map(([nome]) => nome);
              if (falhas.length > 0) throw new Error(titulo + ': falharam ' + falhas.join(', '));
            }

            (async () => {
              // 1. Fingerprint — antes de qualquer DDL.
              const fp = await sql('fingerprint', \`select
                  (select count(*)::int from marketplace_orders) as pedidos,
                  (select count(*)::int from marketplace_orders where status='cancelled') as cancelados\`);
              console.log('FINGERPRINT (pedidos, cancelados):', fp);

              const arquivos = process.env.MIGRACOES.split(',')
                .map((s) => s.trim())
                .filter(Boolean);
              for (const arquivo of arquivos) {
                if (!/^[0-9]{14}_[a-z0-9_-]+\\.sql\$/.test(arquivo)) {
                  throw new Error('RECUSADO (nome fora do padrão): ' + arquivo);
                }
                const caminho = 'supabase/migrations/' + arquivo;
                if (!fs.existsSync(caminho)) throw new Error('NÃO EXISTE: ' + caminho);
                const corpo = fs.readFileSync(caminho, 'utf8');

                // 2. PROVA: o arquivo inteiro dentro de BEGIN/ROLLBACK — o
                // mesmo que o CONTRIBUTING manda rodar à mão antes.
                console.log('=== PROVA (rollback no fim):', arquivo);
                await sql('prova ' + arquivo, 'BEGIN;\\n' + corpo + '\\nROLLBACK;');

                // 3. APPLY de verdade.
                console.log('=== APLICANDO:', arquivo);
                await sql('apply ' + arquivo, corpo);
                console.log('=== APLICADA:', arquivo);
              }

              // 4. VERIFICAÇÃO — só quando houve apply (sem migrations, as
              // funções novas ainda não existem e o run de fingerprint
              // falharia à toa).
              if (arquivos.length > 0) {
                const verificacao = await sql('verificação', \`select
                    has_function_privilege('authenticated', 'public.get_admin_orders_paged(text,text,text,text,integer,integer,text,text)', 'EXECUTE') as paged8,
                    has_function_privilege('authenticated', 'public.get_admin_orders_cancelados_recentes(integer,integer,integer)', 'EXECUTE') as cancelados,
                    has_function_privilege('authenticated', 'public.buscar_por_codigo_barras(text)', 'EXECUTE') as codigo,
                    has_function_privilege('authenticated', 'public.registrar_venda_presencial(jsonb,text,uuid,text,text,numeric,text,uuid)', 'EXECUTE') as venda,
                    exists (select 1 from information_schema.columns where table_name='marketplace_orders' and column_name='canal') as col_canal,
                    exists (select 1 from information_schema.columns where table_name='produtos' and column_name='codigo_barras') as col_codigo\`);
                console.log('VERIFICAÇÃO:', verificacao);
                exigirTudoVerdadeiro('verificação de base', verificacao);
                if (arquivos.includes('20261184000000_o_pix_do_balcao_abre_na_hora.sql')) {
                  const pix84 = await sql('verificação 84', \`select
                    coalesce((select p.prosecdef
                      and 'search_path=pg_catalog, pg_temp' = any(p.proconfig)
                      and has_function_privilege('authenticated', p.oid, 'EXECUTE')
                      and not has_function_privilege('anon', p.oid, 'EXECUTE')
                      from pg_proc p
                      where p.oid = to_regprocedure('public.iniciar_venda_presencial_pix(jsonb, uuid, uuid, text, text, numeric, text)')), false) as rpc_pix_84,
                    exists (select 1 from pg_trigger t
                      where t.tgrelid = 'public.marketplace_orders'::regclass
                        and t.tgname = 'tr_venda_do_balcao_paga_e_entregue'
                        and not t.tgisinternal) as gatilho_entrega_84,
                    exists (select 1 from pg_trigger t
                      where t.tgrelid = 'public.marketplace_orders'::regclass
                        and t.tgname = 'tr_venda_do_balcao_guarda_o_status'
                        and not t.tgisinternal) as gatilho_status_84\`);
                  console.log('VERIFICAÇÃO 84:', pix84);
                  exigirTudoVerdadeiro('verificação 84', pix84);
                }
                if (arquivos.includes('20261185000000_a_venda_do_balcao_se_anula_no_mesmo_dia.sql')) {
                  const anular85 = await sql('verificação 85', \`select
                    coalesce((select p.prosecdef
                      and 'search_path=pg_catalog, pg_temp' = any(p.proconfig)
                      and has_function_privilege('authenticated', p.oid, 'EXECUTE')
                      and not has_function_privilege('anon', p.oid, 'EXECUTE')
                      from pg_proc p
                      where p.oid = to_regprocedure('public.anular_venda_presencial(uuid, text)')), false) as rpc_anular_85\`);
                  console.log('VERIFICAÇÃO 85:', anular85);
                  exigirTudoVerdadeiro('verificação 85', anular85);
                }
                // (A execução de fumaca das RPCs fica de fora DE PROPÓSITO: o
                // gate is_admin() delas nega o role postgres da API de
                // gestão — o RAISE é o próprio gate provando que a função
                // está instalada; quem executa como admin é o app.)
              }
              console.log('FIM: tudo aplicado e verificado.');
            })().catch((e) => { console.error('FALHOU:', e.message); process.exit(1); });
          "
