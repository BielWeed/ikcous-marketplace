# Revisor "@claude" (Claude Code GitHub Actions) — parte do super modo agente v1.
# Desenho completo: mesa GLM (C:/Users/Gabriel/equipe/arquitetura/super-modo-agente/).
# Disparo: comentário com a palavra exata `@claude` em PR (comentário ou review)
# ou em issue nova. O comentarista precisa de permissão de escrita no repo.
# Requisito: secret CLAUDE_CODE_OAUTH_TOKEN (assinatura do dono — sem API paga).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
