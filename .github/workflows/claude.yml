# Revisor "@claude" (Claude Code GitHub Actions) — parte do super modo agente v1.
# Desenho completo: mesa GLM (C:/Users/Gabriel/equipe/arquitetura/super-modo-agente/).
#
# REGRA DO DONO (emenda 1, 02/09 ~22:00): o lado Claude NÃO escreve código —
# só planejamento, arquitetura e revisão. Quem implementa é o GLM (subagente
# GLM 5.3 flash). A regra está aplicada AQUI como permissão: este workflow
# tem `contents: read` (lê o código) e NÃO tem `contents: write` — o robô
# comenta no PR, mas não consegue empurrar commit/branch.
# Time multi-sessão é EXCLUSIVO do lado ZCode (GLM); este workflow é 1 robô,
# 1 tarefa por disparo.
#
# Disparo: comentário com a palavra exata `@claude` em PR (comentário ou
# review) ou em issue nova. O comentarista precisa de permissão de escrita.
# Requisito: secret CLAUDE_CODE_OAUTH_TOKEN (assinatura do dono — sem API paga).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      # contents: read — checkout do código para revisão. SEM write:
      # o revisor não codifica (regra do dono, emenda 1).
      contents: read
      pull-requests: write
      issues: write
      # id-token: write — EXIGIDO pelo claude-code-action (busca token OIDC
      # mesmo autenticando com OAuth; sem isso o run falha em ~26 s com
      # "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL"). Dá identidade, não
      # poder de escrita. Medido em 02/09 (run 33700366317).
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Modelo do lado Claude escolhido pelo dono (02/09): Fable 5.1,
          # topo do plano Max (confirmado no seletor do claude.ai/code).
          model: fable-5.1
